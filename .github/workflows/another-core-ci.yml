name: another-core-ci

on:
  push:
    branches: [main]
    paths:
      - "another/core/**"
      - ".github/workflows/another-core-ci.yml"
  pull_request:
    paths:
      - "another/core/**"
      - ".github/workflows/another-core-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: another/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: another/core/go.sum

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Следующие файлы не прошли gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v -race

  cross-compile:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: another/core
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: android
            goarch: arm64
          # ios/arm64 намеренно не в матрице: требует clang/Xcode toolchain
          # (CGO_ENABLED=1), недоступный на ubuntu-latest раннере — см.
          # another/core/README.md. Собирать на отдельном раннере macos-latest,
          # если/когда появится реальный .xcframework-пайплайн.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: another/core/go.sum

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
