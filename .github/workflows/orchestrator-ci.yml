name: orchestrator-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.9"
          cache: pip

      - name: Install hub dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest python-multipart markdown==3.11.2 pymupdf==2.0 httpx2==2.16.0

      - name: Validate profiles and scripts
        run: |
          python -m orchestrator.config --profile local --isolation embedded validate
          python -m orchestrator.config --profile hf --isolation isolated validate
          python -m orchestrator.hosting_policy --profile hf
          python scripts/prepare_deploy.py --profile hf --dry-run
          bash -n build.sh start.sh

      - name: Run orchestrator tests
        run: python -m pytest -q tests
