name: Sync to Gitea

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: ["netlazy APK Release"]
    types: [completed]

concurrency:
  group: gitea-sync-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    # Paused: this Gitea account cannot hold every repository.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repository to Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/gitea_sync.py
