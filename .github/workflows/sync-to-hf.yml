name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf netlazy/android
          rm -rf .git

          # На свежих раннерах `git init` сразу создаёт ветку main, и
          # `git checkout -b main` падает с "already exists". Из-за `set -e`
          # в Actions весь job тогда умирает за секунды — так и случилось
          # на коммите с vendor/ (run 32984445605, 18 секунд, без retry).
          git init --initial-branch=main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          # Папка называется vendor/, а another/.gitignore игнорит /vendor/
          # (Go vendor). На всякий случай форсим статику админки: без этих
          # файлов панель на Space запрашивает noble-crypto.js и получает 404.
          git add -f another/control-plane-admin/another_admin/api/static/vendor

          if ! git diff --cached --quiet -- another/control-plane-admin/another_admin/api/static/vendor; then
            echo "admin vendor staged:"
            git diff --cached --name-only -- another/control-plane-admin/another_admin/api/static/vendor
          else
            echo "WARNING: admin vendor directory is empty in the index" >&2
            ls -la another/control-plane-admin/another_admin/api/static/vendor || true
          fi

          git commit -m "Automated sync from GitHub"

          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to push to Hugging Face..."
            if git push "https://Nergan:${HF_TOKEN}@huggingface.co/spaces/Nargan/projects" main --force; then
              echo "Push successful!"
              exit 0
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Push failed. Waiting 60 seconds before retrying..."
              sleep 60
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts."
          exit 1
