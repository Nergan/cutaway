name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 
          lfs: false

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf netlazy/android
          rm -rf .git
          
          git init
          git checkout -b main
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Automated sync from GitHub"
          
          # Retry loop to handle Hugging Face 429 (Too Many Requests) errors
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to push to Hugging Face..."
            if git push https://Nergan:$HF_TOKEN@huggingface.co/spaces/Nargan/projects main --force; then
              echo "Push successful!"
              exit 0
            fi
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Push failed. Waiting 60 seconds before retrying..."
              sleep 60
            fi
          done
          
          echo "Failed to push after $MAX_RETRIES attempts."
          exit 1