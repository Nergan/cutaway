name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Depth 1 is faster since we wipe history anyway
          lfs: false

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Remove the entire Android native build folder
          # HF does not need it to run Python, and it prevents binary file rejections
          rm -rf netlazy/android
          
          # 2. Wipe the GitHub commit history completely
          rm -rf .git
          
          # 3. Initialize a fresh, flat Git repository
          git init
          git checkout -b main
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Automated sync from GitHub"
          
          # 4. Force push the single clean commit to Hugging Face
          git push https://Nergan:$HF_TOKEN@huggingface.co/spaces/Nargan/projects main --force