name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Срабатывает только на ветке main. Пуш в cursor/* или другую ветку Action
# не запускает — отсюда «после пуша ничего не едет на HF».
# Ручной запуск: Actions → Sync to Hugging Face Space → Run workflow,
# ветку выбрать main (или ту, которую нужно зеркалить).

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf netlazy/android
          python scripts/prepare_deploy.py --profile hf
          test ! -e another
          test ! -e yellow_mirror
          rm -rf .github
          rm -rf .git

          # На свежих раннерах `git init` сразу создаёт ветку main, и
          # `git checkout -b main` падает с "already exists". Из-за `set -e`
          # в Actions весь job тогда умирает за секунды — так и случилось
          # на коммите с vendor/ (run 32984445605, 18 секунд, без retry).
          git init --initial-branch=main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Automated sync from GitHub"

          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to push to Hugging Face..."
            if git push "https://Nergan:${HF_TOKEN}@huggingface.co/spaces/Nargan/projects" main --force; then
              echo "Push successful!"
              exit 0
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Push failed. Waiting 60 seconds before retrying..."
              sleep 60
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts."
          exit 1
