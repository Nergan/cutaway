[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "another-admin"
version = "0.1.0"
description = "Another VPN — control-plane origin (CLI + API; Telegram-бот в дереве, вне релиза)"
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "pymongo>=4.19,<5",
    "typer>=0.27,<1",
    "aiogram>=3.31,<4",
    "qrcode[pil]>=8.2,<9",
    "httpx>=0.28,<1",
    "fastapi>=0.161,<1",
    "uvicorn>=0.54,<1",
    "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "mongomock>=4.3,<5",
]

[project.scripts]
another-admin = "another_admin.cli.main:app"
another-admin-api = "another_admin.api.__main__:main"

[tool.setuptools.packages.find]
include = ["another_admin*"]

[tool.setuptools.package-data]
another_admin = ["api/static/**/*", "api/portal/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
