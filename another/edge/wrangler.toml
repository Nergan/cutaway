#:schema node_modules/wrangler/config-schema.json
name = "another-edge"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = []

# TCP Sockets API (`cloudflare:sockets`, см. handlers/proxy.ts) доступен
# без дополнительных compatibility_flags при достаточно свежей
# compatibility_date — проверить актуальность при реальном деплое через
# `wrangler deploy --dry-run` (см. edge/README.md).

# --- Durable Objects: nonce-леджер (anti-replay, §7.2) -----------------------
[[durable_objects.bindings]]
name = "NONCE_LEDGER"
class_name = "NonceLedgerObject"

[[migrations]]
tag = "v1" # Можно указать любую версию, например v1
new_sqlite_classes = ["NonceLedgerObject"]

# --- Workers KV: бан-кэш + session store (см. §7.3, index.ts) ----------------
# Один и тот же namespace используется под два разных префикса ключей
# ("ban:" и "session:") — осознанное упрощение для v1, не обязательно
# заводить отдельный namespace ради разделения по неймспейсу ключей.
[[kv_namespaces]]
binding = "BAN_CACHE"
id = "6e88f186512c4f23bc75aa7b5a415b1a" # создаётся через `wrangler kv namespace create BAN_CACHE`

# --- Переменные окружения (не секреты — см. README про `wrangler secret put`) ---
[vars]
# Список Tier1-узлов, отдаваемый клиенту при /enroll (§7.1).
#
# У единственного узла намеренно НЕ заданы host и control_plane: обработчик
# /enroll подставляет туда адрес, по которому клиент к воркеру и обратился
# (см. resolveNodes в src/handlers/enroll.ts). Так конфиг не привязан к
# `<subdomain>.workers.dev` и продолжит работать после переезда на свой домен.
# Если задать host явно — подстановки не будет, значение уйдёт как есть.
#
# Раньше здесь были ещё два узла, hf-space и render, оба как vless-ws на
# /proxy. Это было неверно: /proxy реализован только в самом воркере
# (cloudflare:sockets), а на HF Space и Render никакого VLESS-сервера нет —
# клиент просто перебирал мёртвые адреса при failover. Добавлять их обратно
# имеет смысл только вместе с реальным деплоем data plane из deploy/origin/.
NODES_JSON = "[{\"name\":\"cf-worker\",\"tier\":\"tier1-bootstrap\",\"transport\":\"vless-ws\",\"port\":443,\"path\":\"/proxy\",\"priority\":1}]"

# Origin control-plane (REST-прокси + admin API). URL можно держать в vars;
# секрет — только wrangler secret put.
#
# another живёт в монорепозитории cutaway и смонтирован под префиксом /another,
# поэтому в URL входит и префикс: воркер дёргает
# https://nargan-projects.hf.space/another/internal/v1/... Проверить URL Space:
# HF Space Nargan/projects → https://nargan-projects.hf.space
MONGO_REST_PROXY_URL = "https://nargan-projects.hf.space/another"

# xHTTP data-plane sidecar (Go, core/cmd/xhttp-origin) в образе cutaway НЕ
# запускается — там нет Go-тулчейна, а Space отдаёт один порт 7860. Значение
# оставлено, чтобы биндинг существовал; маршрут /xhttp/* воркера работать не
# будет, пока origin xHTTP не поднят отдельно (Render/VPS, deploy/origin/).
ORIGIN_XHTTP_URL = "https://nargan-projects.hf.space/another"

# --- Секреты (НЕ хранить значения здесь) ------------------------------------
# wrangler secret put ANOTHER_SERVICE_SECRET
# См. .env.example в корне репозитория для локальной разработки через
# `wrangler dev` (секреты в `.dev.vars`, файл в .gitignore).

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
