<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта MikChan</title>
  <link rel="icon" href="https://mikchan.net/favicon.ico">
  <script src="https://cdn.jsdelivr.net/gh/Nergan/cdn@main/donate-widget.js" data-position="bottom-right" defer></script>
  <style>
    html, body { margin: 0; height: 100%; background: #10110e; color: #e8e2d6; }
    body { font: 14px/1.3 Segoe UI, sans-serif; overflow: hidden; }
    #view { position: absolute; inset: 0; z-index: 1; overflow: hidden; cursor: grab; touch-action: none; isolation: isolate; }
    #view.drag { cursor: grabbing; }
    #camera { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    .tile { position: absolute; image-rendering: pixelated; pointer-events: none; }
    .pin {
      position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 20;
      pointer-events: none; background: none; border: 0; padding: 0;
      transform: translate(var(--x), var(--z)) scale(var(--inv)); transform-origin: 0 0;
    }
    .pin i {
      position: absolute; left: -5px; top: -5px; width: 10px; height: 10px;
      background: currentColor; transform: rotate(45deg); box-shadow: 0 0 0 1px #f4f1e8;
    }
    .pin span {
      position: absolute; left: 8px; top: -8px; color: #fff; text-shadow: 0 1px 0 #000, 0 0 2px #000;
      white-space: nowrap; font-size: 12px;
    }
    #view.far .pin span { display: none; }
    #bar, #readout, #menu, #note, #hover, #search .list { background: #16140f; }
    #bar {
      position: absolute; z-index: 8; top: 10px; left: 10px;
      display: flex; gap: 6px; align-items: flex-start;
      border: 1px solid #8a7340; padding: 6px;
    }
    button, .dim, #search input {
      background: #221e16; color: #f0e2bc; border: 1px solid #8a7340;
      padding: 6px 10px; cursor: pointer; opacity: 1;
    }
    button[aria-pressed="true"], .dim[aria-pressed="true"] { background: #3a3220; }
    #search { position: relative; }
    #search input { width: 11rem; cursor: text; }
    #search .list {
      position: absolute; top: calc(100% + 4px); left: 0; min-width: 100%;
      max-height: 240px; overflow: auto; border: 1px solid #8a7340; z-index: 9;
    }
    #search .list[hidden] { display: none; }
    #search .list button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #3a3220; }
    #search .list button.on, #search .list button:hover { background: #3a3220; }
    #readout {
      position: absolute; z-index: 8; top: 10px; right: 12px;
      border: 1px solid #8a7340; padding: 6px 8px; min-width: 8rem;
    }
    #hover, #menu {
      position: absolute; z-index: 30; border: 1px solid #8a7340;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); padding: 8px;
    }
    #hover { pointer-events: none; }
    #hover strong, #menu strong { display: block; color: #e6c36a; margin-bottom: 4px; }
    #menu { z-index: 31; min-width: 220px; }
    #menu[hidden], #note[hidden], #hover[hidden] { display: none; }
    #menu button, #menu input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; }
    #menu [hidden] { display: none; }
    #menu input { background: #221e16; color: #fff; border: 1px solid #8a7340; padding: 6px; }
    #note { position: absolute; z-index: 32; right: 16px; bottom: 72px; color: #c8b48a; background: transparent; }
    #server {
      position: absolute; left: 12px; bottom: 12px; z-index: 8;
      color: #a89878; font-size: 13px; text-decoration: none;
    }
    #server:hover { color: #f0e2bc; }
    #loading {
      position: absolute; inset: 0; z-index: 40; display: grid; place-items: center;
      background: #10110e; text-align: center;
    }
    #loading[hidden] { display: none; }
    #loading p { margin: 0 0 12px; color: #f0e2bc; }
    #loading .track {
      width: min(280px, 70vw); height: 8px; border: 1px solid #8a7340; background: #221e16;
    }
    #loading .bar { height: 100%; width: 0; background: #c8b48a; }
    #empty {
      position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; text-align: center; padding: 2rem;
    }
    #empty[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="view"><div id="camera"></div></div>
  <div id="bar">
    <div id="search">
      <input type="search" autocomplete="off" spellcheck="false">
      <div class="list" hidden></div>
    </div>
  </div>
  <div id="readout" hidden><span></span></div>
  <div id="hover" hidden><strong></strong><span></span></div>
  <a id="server" href="https://mikchan.net">mikchan.net</a>
  <div id="loading"><p></p><div class="track"><div class="bar"></div></div></div>
  <form id="menu" hidden></form>
  <div id="note" hidden></div>
  <div id="empty" hidden></div>
  <script>
    const ru = (navigator.language || "").toLowerCase().startsWith("ru");
    const text = (en, rus) => ru ? rus : en;
    const viewEl = document.getElementById("view");
    const camera = document.getElementById("camera");
    const bar = document.getElementById("bar");
    const readout = document.getElementById("readout");
    const hover = document.getElementById("hover");
    const menu = document.getElementById("menu");
    const note = document.getElementById("note");
    const empty = document.getElementById("empty");
    const loading = document.getElementById("loading");
    const searchInput = document.querySelector("#search input");
    const searchList = document.querySelector("#search .list");
    const loadingLabel = loading.querySelector("p");
    const loadingBar = loading.querySelector(".bar");
    searchInput.placeholder = text("Marker", "Метка");
    loadingLabel.textContent = text("Loading the map", "Карта загружается");
    const tiles = new Map();
    const pins = new Map();
    const view = { x: 0, z: 0, scale: 0.25, min: 0.01, max: 6 };
    let catalog = null;
    let dimension = null;
    let drag = null;
    let frame = 0;
    let searchPick = 0;
    const errors = {
      name: text("Give the marker a name.", "Нужно имя метки."),
      place: text("Those coordinates are not on the map.", "Таких координат на карте нет."),
      kind: text("This suggestion is not supported.", "Такое предложение не поддерживается."),
      dimension: text("Unknown dimension.", "Неизвестное измерение."),
      body: text("The suggestion could not be read.", "Предложение не прочиталось."),
      store: text("The suggestion was not saved.", "Предложение не записалось.")
    };

    function say(message) {
      note.hidden = false;
      note.textContent = message;
      clearTimeout(say.timer);
      say.timer = setTimeout(() => { note.hidden = true; }, 3200);
    }

    function api(path) {
      const url = new URL(location.href);
      if (!url.pathname.endsWith("/")) url.pathname += "/";
      return new URL(path, url).href;
    }

    function tileUrl(level, x, z) {
      return "https://res.cloudinary.com/" + catalog.cloud + "/image/upload/mikchan-map/"
        + dimension.id + "/" + level + "/" + x + "_" + z + ".webp?v=2";
    }

    function blockOf(clientX, clientY) {
      const rect = viewEl.getBoundingClientRect();
      return [
        view.x + (clientX - rect.left - rect.width / 2) / view.scale,
        view.z + (clientY - rect.top - rect.height / 2) / view.scale
      ];
    }

    function chosenLevel() {
      const levels = dimension.levels.slice().sort((a, b) => a.blocks - b.blocks);
      let index = 0;
      while (index < levels.length - 1 && levels[index].blocks * view.scale < 180) index += 1;
      const level = levels[index];
      if (!level.lookup) level.lookup = new Set(level.tiles.map((pair) => pair[0] + ":" + pair[1]));
      return level;
    }

    function visibleTiles() {
      const level = chosenLevel();
      const rect = viewEl.getBoundingClientRect();
      const pad = 64;
      const [x0, z0] = blockOf(rect.left - pad, rect.top - pad);
      const [x1, z1] = blockOf(rect.right + pad, rect.bottom + pad);
      const minX = Math.floor(x0 / level.blocks);
      const maxX = Math.floor(x1 / level.blocks);
      const minZ = Math.floor(z0 / level.blocks);
      const maxZ = Math.floor(z1 / level.blocks);
      const found = [];
      const push = (x, z) => found.push({
        level: level.level, blocks: level.blocks, x, z,
        worldX: x * level.blocks, worldZ: z * level.blocks
      });
      const cells = (maxX - minX + 1) * (maxZ - minZ + 1);
      if (cells > level.lookup.size) {
        for (const key of level.lookup) {
          const [x, z] = key.split(":").map(Number);
          if (x < minX || x > maxX || z < minZ || z > maxZ) continue;
          push(x, z);
        }
        return found;
      }
      for (let x = minX; x <= maxX; x += 1) {
        for (let z = minZ; z <= maxZ; z += 1) {
          if (level.lookup.has(x + ":" + z)) push(x, z);
        }
      }
      return found;
    }

    function applyCamera() {
      const rect = viewEl.getBoundingClientRect();
      const ox = rect.width / 2 - view.x * view.scale;
      const oy = rect.height / 2 - view.z * view.scale;
      camera.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + view.scale + ")";
      camera.style.setProperty("--inv", String(1 / view.scale));
      viewEl.classList.toggle("far", view.scale < 0.18);
    }

    function syncTiles() {
      const wanted = new Set();
      for (const tile of visibleTiles()) {
        const key = tile.level + ":" + tile.x + ":" + tile.z;
        wanted.add(key);
        if (tiles.has(key)) continue;
        const image = document.createElement("img");
        image.className = "tile";
        image.alt = "";
        image.draggable = false;
        image.src = tileUrl(tile.level, tile.x, tile.z);
        image.style.left = tile.worldX + "px";
        image.style.top = tile.worldZ + "px";
        image.style.width = tile.blocks + "px";
        image.style.height = tile.blocks + "px";
        image.style.zIndex = String(8 - tile.level);
        image.addEventListener("error", () => { image.remove(); tiles.delete(key); });
        camera.appendChild(image);
        tiles.set(key, image);
      }
      for (const [key, image] of tiles) {
        if (!wanted.has(key)) { image.remove(); tiles.delete(key); }
      }
    }

    function mountPins() {
      pins.forEach((pin) => pin.remove());
      pins.clear();
      dimension.waypoints.forEach((marker, index) => {
        const pin = document.createElement("button");
        pin.type = "button";
        pin.className = "pin";
        pin.innerHTML = "<i></i><span></span>";
        pin.style.color = marker.color;
        pin.style.setProperty("--x", marker.x + "px");
        pin.style.setProperty("--z", marker.z + "px");
        pin.querySelector("span").textContent = marker.initials;
        pin.addEventListener("contextmenu", (event) => openMenu(event, marker));
        camera.appendChild(pin);
        pins.set(index, pin);
      });
    }

    function redraw() {
      frame = 0;
      if (!dimension) return;
      applyCamera();
      syncTiles();
    }

    function requestDraw() {
      if (!frame) frame = requestAnimationFrame(redraw);
    }

    function tightRange(values) {
      let ordered = values.slice().sort((a, b) => a - b);
      while (ordered.length > 4) {
        let best = 0;
        let split = 0;
        for (let i = 1; i < ordered.length; i += 1) {
          const gap = ordered[i] - ordered[i - 1];
          if (gap > best) { best = gap; split = i; }
        }
        if (best < 64) break;
        const left = split;
        const right = ordered.length - split;
        ordered = left >= right ? ordered.slice(0, split) : ordered.slice(split);
      }
      return [ordered[0], ordered[ordered.length - 1]];
    }

    function focusBounds() {
      const finest = dimension.levels.slice().sort((a, b) => a.blocks - b.blocks)[0];
      if (!finest || !finest.tiles.length) return dimension.bounds;
      const [x0, x1] = tightRange(finest.tiles.map((pair) => pair[0]));
      const [z0, z1] = tightRange(finest.tiles.map((pair) => pair[1]));
      return {
        minX: x0 * finest.blocks,
        maxX: (x1 + 1) * finest.blocks,
        minZ: z0 * finest.blocks,
        maxZ: (z1 + 1) * finest.blocks
      };
    }

    function fit(closer) {
      const bounds = focusBounds();
      const width = Math.max(1, bounds.maxX - bounds.minX);
      const height = Math.max(1, bounds.maxZ - bounds.minZ);
      const rect = viewEl.getBoundingClientRect();
      const fitted = Math.min((rect.width - 48) / width, (rect.height - 48) / height);
      view.min = Math.max(fitted * 0.85, 0.0005);
      if (!closer) {
        view.x = (bounds.minX + bounds.maxX) / 2;
        view.z = (bounds.minZ + bounds.maxZ) / 2;
        view.scale = Math.max(view.min, fitted);
        requestDraw();
        return;
      }
      const inside = dimension.waypoints.filter((marker) =>
        marker.x >= bounds.minX && marker.x <= bounds.maxX && marker.z >= bounds.minZ && marker.z <= bounds.maxZ
      );
      const source = inside.length ? inside : [{ x: (bounds.minX + bounds.maxX) / 2, z: (bounds.minZ + bounds.maxZ) / 2 }];
      const xs = source.map((marker) => marker.x).sort((a, b) => a - b);
      const zs = source.map((marker) => marker.z).sort((a, b) => a - b);
      const mid = (xs.length - 1) >> 1;
      view.x = xs[mid];
      view.z = zs[mid];
      view.scale = Math.min(view.max, Math.max(view.min, 0.5));
      requestDraw();
    }

    function zoomAt(clientX, clientY, factor) {
      const [worldX, worldZ] = blockOf(clientX, clientY);
      view.scale = Math.min(view.max, Math.max(view.min, view.scale * factor));
      const rect = viewEl.getBoundingClientRect();
      view.x = worldX - (clientX - rect.left - rect.width / 2) / view.scale;
      view.z = worldZ - (clientY - rect.top - rect.height / 2) / view.scale;
      requestDraw();
    }

    function goTo(marker) {
      view.x = marker.x;
      view.z = marker.z;
      view.scale = Math.min(view.max, Math.max(view.min, 1));
      searchList.hidden = true;
      searchInput.value = marker.name;
      menu.hidden = true;
      hover.hidden = true;
      requestDraw();
    }

    function matchingMarkers() {
      const needle = searchInput.value.trim().toLowerCase();
      if (!needle || !dimension) return [];
      return dimension.waypoints.filter((marker) => marker.name.toLowerCase().includes(needle)).slice(0, 12);
    }

    function renderSearch() {
      const found = matchingMarkers();
      searchList.replaceChildren();
      if (!found.length) { searchList.hidden = true; return; }
      if (searchPick >= found.length) searchPick = found.length - 1;
      searchList.hidden = false;
      found.forEach((marker, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = index === searchPick ? "on" : "";
        button.textContent = marker.name;
        button.addEventListener("mousedown", (event) => event.preventDefault());
        button.addEventListener("click", () => goTo(marker));
        searchList.appendChild(button);
      });
    }

    let warmToken = 0;

    function preload(url) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve();
        image.onerror = () => resolve();
        image.src = url;
      });
    }

    async function warm() {
      const token = ++warmToken;
      const opening = visibleTiles();
      loading.hidden = false;
      readout.hidden = true;
      if (!opening.length) {
        loading.hidden = true;
        readout.hidden = false;
        return;
      }
      let finished = 0;
      await Promise.all(opening.map((tile) => preload(tileUrl(tile.level, tile.x, tile.z)).then(() => {
        finished += 1;
        if (token !== warmToken) return;
        loadingLabel.textContent = text("Tiles " + finished + " / " + opening.length, "Тайлы " + finished + " / " + opening.length);
        loadingBar.style.width = (12 + 88 * finished / opening.length) + "%";
      })));
      if (token !== warmToken) return;
      loading.hidden = true;
      readout.hidden = false;
    }

    function showDimension(id) {
      dimension = catalog.dimensions.find((item) => item.id === id) || catalog.dimensions[0];
      tiles.forEach((image) => image.remove());
      tiles.clear();
      for (const button of bar.querySelectorAll(".dim")) {
        button.setAttribute("aria-pressed", button.dataset.id === dimension.id ? "true" : "false");
      }
      menu.hidden = true;
      hover.hidden = true;
      searchList.hidden = true;
      searchInput.value = "";
      mountPins();
      fit(true);
      warm();
    }

    function markerAt(clientX, clientY) {
      const [x, z] = blockOf(clientX, clientY);
      const reach = 16 / view.scale;
      let best = reach * reach;
      let found = null;
      for (const marker of dimension.waypoints) {
        const dx = marker.x - x;
        const dz = marker.z - z;
        const distance = dx * dx + dz * dz;
        if (distance < best) { best = distance; found = marker; }
      }
      return found;
    }

    function placePopup(node, clientX, clientY) {
      node.hidden = false;
      node.style.left = "0px";
      node.style.top = "0px";
      const box = node.getBoundingClientRect();
      const rect = viewEl.getBoundingClientRect();
      let left = clientX + 14;
      let top = clientY + 14;
      if (left + box.width > rect.right - 8) left = clientX - box.width - 14;
      if (top + box.height > rect.bottom - 8) top = clientY - box.height - 14;
      node.style.left = Math.max(8, left) + "px";
      node.style.top = Math.max(8, top) + "px";
    }

    function showHover(event, marker) {
      if (!marker || drag) { hover.hidden = true; return; }
      hover.querySelector("strong").textContent = marker.name;
      const height = marker.y == null ? "" : "  Y " + marker.y;
      hover.querySelector("span").textContent = "X " + marker.x + height + "  Z " + marker.z;
      placePopup(hover, event.clientX, event.clientY);
    }

    function openMenu(event, marker) {
      event.preventDefault();
      event.stopPropagation();
      hover.hidden = true;
      const point = marker || null;
      const [x, z] = point ? [point.x, point.z] : blockOf(event.clientX, event.clientY).map(Math.round);
      const y = point ? point.y : null;
      menu.innerHTML = "";
      const title = document.createElement("strong");
      title.textContent = point ? point.name : text("Empty place", "Пустое место");
      menu.appendChild(title);
      const place = document.createElement("div");
      place.textContent = "X " + x + (y === null ? "" : "  Y " + y) + "  Z " + z;
      menu.appendChild(place);
      if (!point) field(text("Suggest a marker", "Предложить метку"), "add", x, y, z, "");
      else {
        field(text("Suggest a rename", "Предложить переименовать"), "rename", x, y, z, point.name);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = text("Suggest removal", "Предложить удалить");
        remove.addEventListener("click", () => send({ kind: "delete", dimension: dimension.id, x, y, z, name: "", waypoint: point.name }));
        menu.appendChild(remove);
      }
      placePopup(menu, event.clientX, event.clientY);
    }

    function field(label, kind, x, y, z, waypoint) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      const input = document.createElement("input");
      input.maxLength = 80;
      input.placeholder = text("Name", "Имя");
      input.value = kind === "rename" ? waypoint : "";
      const save = document.createElement("button");
      save.type = "submit";
      save.textContent = text("Save", "Записать");
      button.addEventListener("click", () => { input.hidden = false; save.hidden = false; input.focus(); });
      save.addEventListener("click", (event) => {
        event.preventDefault();
        send({ kind, dimension: dimension.id, x, y, z, name: input.value, waypoint });
      });
      input.hidden = true;
      save.hidden = true;
      menu.append(button, input, save);
    }

    async function send(body) {
      const response = await fetch(api("api/suggestions"), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body)
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        say(errors[payload.error] || errors.store);
        return;
      }
      menu.hidden = true;
      say(text("Saved. It is only a suggestion.", "Записано. Это только предложение."));
    }

    function pointerReadout(event) {
      if (!dimension) return;
      const [x, z] = blockOf(event.clientX, event.clientY);
      readout.querySelector("span").textContent = "X " + Math.round(x) + "  Z " + Math.round(z);
      showHover(event, markerAt(event.clientX, event.clientY));
    }

    viewEl.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      menu.hidden = true;
      drag = { id: event.pointerId, x: event.clientX, z: event.clientY, vx: view.x, vz: view.z };
      viewEl.classList.add("drag");
      hover.hidden = true;
      viewEl.setPointerCapture(event.pointerId);
    });
    viewEl.addEventListener("pointermove", (event) => {
      pointerReadout(event);
      if (!drag || drag.id !== event.pointerId) return;
      view.x = drag.vx - (event.clientX - drag.x) / view.scale;
      view.z = drag.vz - (event.clientY - drag.z) / view.scale;
      requestDraw();
    });
    viewEl.addEventListener("pointerup", () => { drag = null; viewEl.classList.remove("drag"); });
    viewEl.addEventListener("pointerleave", () => { hover.hidden = true; });
    viewEl.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoomAt(event.clientX, event.clientY, event.deltaY < 0 ? 1.15 : 1 / 1.15);
    }, { passive: false });
    viewEl.addEventListener("contextmenu", (event) => openMenu(event, markerAt(event.clientX, event.clientY)));
    viewEl.addEventListener("dblclick", (event) => zoomAt(event.clientX, event.clientY, 2));
    window.addEventListener("resize", requestDraw);
    window.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      menu.hidden = true;
      searchList.hidden = true;
    });
    menu.addEventListener("submit", (event) => event.preventDefault());
    searchInput.addEventListener("input", () => { searchPick = 0; renderSearch(); });
    searchInput.addEventListener("keydown", (event) => {
      const found = matchingMarkers();
      if (event.key === "ArrowDown") {
        event.preventDefault();
        searchPick = Math.min(found.length - 1, searchPick + 1);
        renderSearch();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        searchPick = Math.max(0, searchPick - 1);
        renderSearch();
      } else if (event.key === "Enter") {
        event.preventDefault();
        const marker = found[searchPick] || found[0];
        if (marker) goTo(marker);
      }
    });

    function tool(label, action) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.addEventListener("click", action);
      bar.appendChild(button);
      return button;
    }

    async function boot() {
      loadingLabel.textContent = text("Reading the catalog", "Читаю каталог");
      loadingBar.style.width = "8%";
      let response;
      try {
        response = await fetch(api("api/map"));
        catalog = await response.json();
      } catch (error) {
        catalog = {};
        response = { ok: false };
      }
      if (!response.ok || !catalog.cloud || !catalog.dimensions || !catalog.dimensions.length) {
        loading.hidden = true;
        empty.hidden = false;
        empty.textContent = text("The map is not published yet.", "Карта ещё не опубликована.");
        return;
      }
      const names = {
        overworld: text("Overworld", "Верхний мир"),
        nether: text("Nether", "Незер"),
        end: text("End", "Край")
      };
      for (const item of catalog.dimensions) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "dim";
        button.dataset.id = item.id;
        button.textContent = names[item.id] || item.id;
        button.addEventListener("click", () => showDimension(item.id));
        bar.insertBefore(button, document.getElementById("search"));
      }
      tool("+", () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25));
      tool("−", () => zoomAt(innerWidth / 2, innerHeight / 2, 0.8));
      tool(text("Whole map", "Вся карта"), () => fit(false));
      showDimension(catalog.dimensions[0].id);
    }
    boot();
  </script>
</body>
</html>
