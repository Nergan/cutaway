<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта MikChan</title>
  <link rel="icon" href="https://mikchan.net/favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/gh/Nergan/cdn@main/donate-widget.js?v=2" data-position="bottom-right" defer></script>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1a1a; color: #ffffff; }
    * { scrollbar-width: thin; scrollbar-color: #8b8b8b #1a1a1a; }
    *::-webkit-scrollbar { width: 12px; height: 12px; }
    *::-webkit-scrollbar-track { background: #1a1a1a; }
    *::-webkit-scrollbar-thumb {
      background: #8b8b8b;
      border: 2px solid #1a1a1a;
      box-shadow: inset -2px -2px 0 #373737, inset 2px 2px 0 #c6c6c6;
    }
    *::-webkit-scrollbar-thumb:hover { background: #b5b5b5; }
    *::-webkit-scrollbar-corner { background: #1a1a1a; }
    body { font: 16px/1.35 "Pixelify Sans", "Courier New", monospace; overflow: hidden; image-rendering: pixelated; }
    #view { position: absolute; inset: 0; z-index: 1; overflow: hidden; cursor: grab; touch-action: none; isolation: isolate; background: #111; }
    #view.drag { cursor: grabbing; }
    #camera { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    .tile {
      position: absolute; pointer-events: none; overflow: hidden;
      background: #243024;
      background-image: linear-gradient(110deg, #1b2a1b 0%, #4d6b3a 42%, #1b2a1b 78%);
      background-size: 220% 100%;
      animation: tile-shimmer 1.1s linear infinite;
    }
    .tile.ready { animation: none; background: #111; }
    .tile img {
      position: absolute; left: 0; top: 0; width: calc(100% + 1px); height: calc(100% + 1px);
      image-rendering: pixelated; opacity: 0;
    }
    .tile.ready img { opacity: 1; }
    @keyframes tile-shimmer {
      from { background-position: 100% 0; }
      to { background-position: -100% 0; }
    }
    .pin {
      position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 20;
      pointer-events: none; background: none; border: 0; padding: 0;
      transform: translate(var(--x), var(--z)) scale(var(--inv)); transform-origin: 0 0;
    }
    .pin img {
      position: absolute; left: -15px; top: -30px; width: 30px; height: 30px;
      image-rendering: pixelated; pointer-events: none;
    }
    #bar {
      position: absolute; z-index: 8; top: 0; left: 0;
      display: flex; flex-wrap: wrap; gap: 2px; align-items: flex-start;
      max-width: calc(100% - 180px); padding: 0; background: transparent; border: 0;
    }
    button, .dim, #search input, #menu input, #gate input, #server, #readout, #hover, #menu, #search .list {
      font: 16px/1.35 "Pixelify Sans", "Courier New", monospace;
      color: #ffffff;
      text-shadow: 2px 2px 0 #3f3f3f;
      background: #8b8b8b;
      border: 2px solid #000;
      box-shadow: inset -2px -2px 0 #373737, inset 2px 2px 0 #ffffff;
      border-radius: 0;
    }
    button, .dim, #search input, #menu input, #gate input, #server {
      padding: 4px 8px; cursor: pointer; opacity: 1;
    }
    button:hover, .dim:hover, #server:hover {
      background: #a0a0a0; color: #ffffa0; text-shadow: 2px 2px 0 #3f3f00;
    }
    button.pin, button.pin:hover {
      background: none; border: 0; box-shadow: none; padding: 0;
      text-shadow: none; cursor: default;
    }
    button[aria-pressed="true"], .dim[aria-pressed="true"] {
      background: #707070; color: #ffffa0;
      box-shadow: inset 2px 2px 0 #373737, inset -2px -2px 0 #ffffff;
    }
    #search { position: relative; }
    #search input { width: 14rem; cursor: text; color: #ffffff; text-shadow: 2px 2px 0 #3f3f3f; }
    #search .list {
      position: absolute; top: 100%; left: 0; min-width: 100%;
      max-height: 280px; overflow: auto; z-index: 9; padding: 0;
    }
    #search .list[hidden] { display: none; }
    #search .list button {
      display: block; width: 100%; text-align: left;
      border-width: 0 0 2px; box-shadow: none; background: #8b8b8b;
    }
    #search .list button.on, #search .list button:hover { background: #b6b6b6; color: #ffffa0; }
    #readout {
      position: absolute; z-index: 8; top: 0; right: 0;
      padding: 4px 8px; display: flex; gap: 10px; align-items: center;
    }
    #readout[hidden] { display: none; }
    #biome { color: #55ff55; text-shadow: 2px 2px 0 #1d3b1d; }
    #biome:empty { display: none; }
    #hover, #menu { position: absolute; z-index: 30; padding: 8px; }
    #hover { pointer-events: none; }
    #hover strong, #menu strong { display: block; color: #ffff55; margin-bottom: 4px; text-shadow: 2px 2px 0 #3f3f00; }
    #menu { z-index: 31; min-width: 240px; }
    #menu[hidden], #note[hidden], #hover[hidden] { display: none; }
    #menu button, #menu input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; }
    #menu [hidden] { display: none; }
    #menu input, #gate input { color: #ffffff; cursor: text; }
    #menu input::placeholder, #gate input::placeholder { color: #e8e8e8; }
    body.locked > :not(#gate) { display: none !important; }
    #gate {
      position: absolute; inset: 0; z-index: 60; margin: 0;
      display: grid; place-items: center; background: #0c0c0c;
    }
    #gate[hidden] { display: none; }
    #gate div { width: min(22rem, 86vw); }
    #gate input { width: 100%; box-sizing: border-box; }
    #gate p {
      min-height: 1.2em; margin: 8px 0 0; color: #ff5555;
      text-shadow: 2px 2px 0 #3f0000;
    }
    #note {
      position: absolute; z-index: 32; right: 0; bottom: 52px;
      color: #ffff55; background: transparent; border: 0; box-shadow: none;
      text-shadow: 2px 2px 0 #3f3f00; padding: 4px 8px;
    }
    #server {
      position: absolute; left: 0; bottom: 0; z-index: 8;
      font-size: 22px; padding: 6px 10px; text-decoration: none;
      color: #ffff55; text-shadow: 2px 2px 0 #3f3f00;
    }
    #loading {
      position: absolute; inset: 0; z-index: 40; display: grid; place-items: center;
      background: #1a1a1a; text-align: center;
    }
    #loading[hidden] { display: none; }
    #loading p { margin: 0 0 12px; color: #ffffff; text-shadow: 2px 2px 0 #3f3f3f; }
    #loading .track {
      width: min(280px, 70vw); height: 10px; border: 2px solid #000; background: #373737;
      box-shadow: inset -2px -2px 0 #555, inset 2px 2px 0 #111;
    }
    #loading .bar { height: 100%; width: 0; background: #54c430; }
    #empty {
      position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; text-align: center; padding: 2rem;
    }
    #empty[hidden] { display: none; }
  </style>
</head>
<body class="locked">
  <form id="gate">
    <div>
      <input id="key" maxlength="80" autocomplete="off" spellcheck="false" placeholder="введите ключ доступа">
      <p id="gate-error"></p>
    </div>
  </form>
  <div id="view"><div id="camera"></div></div>
  <div id="bar">
    <div id="search">
      <input type="search" autocomplete="off" spellcheck="false">
      <div class="list" hidden></div>
    </div>
  </div>
  <div id="readout" hidden><span id="coords"></span><span id="biome"></span></div>
  <div id="hover" hidden><strong></strong><span></span></div>
  <a id="server" href="https://mikchan.net">mikchan.net</a>
  <div id="loading"><p></p><div class="track"><div class="bar"></div></div></div>
  <form id="menu" hidden></form>
  <div id="note" hidden></div>
  <div id="empty" hidden></div>
  <script>
    const ru = (navigator.language || "").toLowerCase().startsWith("ru");
    const text = (en, rus) => ru ? rus : en;
    const viewEl = document.getElementById("view");
    const camera = document.getElementById("camera");
    const bar = document.getElementById("bar");
    const readout = document.getElementById("readout");
    const hover = document.getElementById("hover");
    const menu = document.getElementById("menu");
    const note = document.getElementById("note");
    const empty = document.getElementById("empty");
    const loading = document.getElementById("loading");
    const searchInput = document.querySelector("#search input");
    const searchList = document.querySelector("#search .list");
    const loadingLabel = loading.querySelector("p");
    const loadingBar = loading.querySelector(".bar");
    const coordsEl = document.getElementById("coords");
    const biomeEl = document.getElementById("biome");
    const biomeRegions = new Map();
    const BIOMES = {
      "minecraft:plains": ["Plains", "Равнины"],

      "minecraft:windswept_forest": ["Windswept Forest", "Выветренный лес"],
      "minecraft:windswept_savanna": ["Windswept Savanna", "Выветренная саванна"],
      "minecraft:jungle": ["Jungle", "Джунгли"],
      "minecraft:sparse_jungle": ["Sparse Jungle", "Разреженные джунгли"],
      "minecraft:bamboo_jungle": ["Bamboo Jungle", "Бамбуковые джунгли"],
      "minecraft:badlands": ["Badlands", "Пустошь"],

      "minecraft:wooded_badlands": ["Wooded Badlands", "Лесистая пустошь"],
      "minecraft:meadow": ["Meadow", "Луг"],

      "minecraft:grove": ["Grove", "Роща"],
      "minecraft:snowy_slopes": ["Snowy Slopes", "Заснеженные склоны"],
      "minecraft:frozen_peaks": ["Frozen Peaks", "Замёрзшие пики"],
      "minecraft:jagged_peaks": ["Jagged Peaks", "Острые пики"],
      "minecraft:stony_peaks": ["Stony Peaks", "Каменистые пики"],
      "minecraft:river": ["River", "Река"],
      "minecraft:frozen_river": ["Frozen River", "Замёрзшая река"],
      "minecraft:beach": ["Beach", "Пляж"],
      "minecraft:snowy_beach": ["Snowy Beach", "Снежный пляж"],
      "minecraft:stony_shore": ["Stony Shore", "Каменистый берег"],
      "minecraft:ocean": ["Ocean", "Океан"],
      "minecraft:deep_ocean": ["Deep Ocean", "Глубокий океан"],
      "minecraft:warm_ocean": ["Warm Ocean", "Тёплый океан"],
      "minecraft:lukewarm_ocean": ["Lukewarm Ocean", "Тепловатый океан"],
      "minecraft:deep_lukewarm_ocean": ["Deep Lukewarm Ocean", "Глубокий тепловатый океан"],
      "minecraft:cold_ocean": ["Cold Ocean", "Холодный океан"],
      "minecraft:deep_cold_ocean": ["Deep Cold Ocean", "Глубокий холодный океан"],
      "minecraft:frozen_ocean": ["Frozen Ocean", "Замёрзший океан"],
      "minecraft:deep_frozen_ocean": ["Deep Frozen Ocean", "Глубокий замёрзший океан"],
      "minecraft:mushroom_fields": ["Mushroom Fields", "Грибные поля"],
      "minecraft:dripstone_caves": ["Dripstone Caves", "Пещеры капельника"],
      "minecraft:lush_caves": ["Lush Caves", "Пышные пещеры"],
      "minecraft:deep_dark": ["Deep Dark", "Древние недра"],
      "minecraft:pale_garden": ["Pale Garden", "Бледный сад"],
      "minecraft:nether_wastes": ["Nether Wastes", "Пустоши Незера"],
      "minecraft:soul_sand_valley": ["Soul Sand Valley", "Долина песка душ"],
      "minecraft:crimson_forest": ["Crimson Forest", "Багровый лес"],
      "minecraft:warped_forest": ["Warped Forest", "Искажённый лес"],
      "minecraft:basalt_deltas": ["Basalt Deltas", "Базальтовые дельты"],
      "minecraft:the_end": ["The End", "Край"],
      "minecraft:end_highlands": ["End Highlands", "Высоты Края"],
      "minecraft:end_midlands": ["End Midlands", "Средние земли Края"],
      "minecraft:end_barrens": ["End Barrens", "Пустоши Края"],
      "minecraft:small_end_islands": ["Small End Islands", "Малые острова Края"],
      "minecraft:the_void": ["The Void", "Пустота"]
    };
    const PIN_ROWS = [
      "000000222000000",
      "000002111120000",
      "000021111112000",
      "000211111111200",
      "002111111111120",
      "021111111111112",
      "021111111111112",
      "002111111111120",
      "000211111111200",
      "000021111112000",
      "000002111120000",
      "000000222000000",
      "000000121000000",
      "000000020000000",
      "000000010000000"
    ];
    const pinImages = new Map();
    searchInput.placeholder = text("Marker or biome", "Метка или биом");
    loadingLabel.textContent = text("Loading the map", "Карта загружается");
    const tiles = new Map();
    const pins = new Map();
    const view = { x: 0, z: 0, scale: 0.25, min: 0.01, max: 6 };
    let catalog = null;
    let dimension = null;
    let drag = null;
    let frame = 0;
    let searchPick = 0;
    const errors = {
      name: text("Give the marker a name.", "Нужно имя метки."),
      place: text("Those coordinates are not on the map.", "Таких координат на карте нет."),
      kind: text("This suggestion is not supported.", "Такое предложение не поддерживается."),
      dimension: text("Unknown dimension.", "Неизвестное измерение."),
      body: text("The suggestion could not be read.", "Предложение не прочиталось."),
      store: text("The suggestion was not saved.", "Предложение не записалось.")
    };

    function say(message) {
      note.hidden = false;
      note.textContent = message;
      clearTimeout(say.timer);
      say.timer = setTimeout(() => { note.hidden = true; }, 3200);
    }

    function api(path) {
      const url = new URL(location.href);
      if (!url.pathname.endsWith("/")) url.pathname += "/";
      return new URL(path, url).href;
    }

    function tileUrl(level, x, z) {
      return api("api/tiles/" + dimension.id + "/" + level + "/" + x + "/" + z);
    }

    function blockOf(clientX, clientY) {
      const rect = viewEl.getBoundingClientRect();
      return [
        view.x + (clientX - rect.left - rect.width / 2) / view.scale,
        view.z + (clientY - rect.top - rect.height / 2) / view.scale
      ];
    }

    function levelsReady() {
      const levels = dimension.levels.slice().sort((a, b) => a.blocks - b.blocks);
      for (const level of levels) {
        if (!level.lookup) level.lookup = new Set(level.tiles.map((pair) => pair[0] + ":" + pair[1]));
      }
      return levels;
    }

    function chosenLevel() {
      const levels = levelsReady();
      let index = 0;
      while (index < levels.length - 1 && levels[index].blocks * view.scale < 180) index += 1;
      return levels[index];
    }

    function visibleTiles() {
      const levels = levelsReady();
      const preferred = chosenLevel();
      if (!preferred) return [];
      const rect = viewEl.getBoundingClientRect();
      const pad = 64;
      const [x0, z0] = blockOf(rect.left - pad, rect.top - pad);
      const [x1, z1] = blockOf(rect.right + pad, rect.bottom + pad);
      const found = [];
      const seen = new Set();
      const covered = [];
      const push = (level, x, z) => {
        const id = level.level + ":" + x + ":" + z;
        if (seen.has(id)) return;
        seen.add(id);
        found.push({
          level: level.level, blocks: level.blocks, x, z,
          worldX: x * level.blocks, worldZ: z * level.blocks
        });
      };
      const hits = (level, x, z) => {
        const wx = x * level.blocks;
        const wz = z * level.blocks;
        return wx < x1 && wx + level.blocks > x0 && wz < z1 && wz + level.blocks > z0;
      };
      const inside = (box, level, x, z) => {
        const wx = x * level.blocks;
        const wz = z * level.blocks;
        return box.x <= wx && box.z <= wz && box.x2 >= wx + level.blocks && box.z2 >= wz + level.blocks;
      };
      for (const key of preferred.lookup) {
        const [x, z] = key.split(":").map(Number);
        if (!hits(preferred, x, z)) continue;
        push(preferred, x, z);
        covered.push({
          x: x * preferred.blocks, z: z * preferred.blocks,
          x2: (x + 1) * preferred.blocks, z2: (z + 1) * preferred.blocks
        });
      }
      for (const level of levels.filter((item) => item.blocks < preferred.blocks).sort((a, b) => b.blocks - a.blocks)) {
        let added = 0;
        for (const key of level.lookup) {
          const [x, z] = key.split(":").map(Number);
          if (!hits(level, x, z) || covered.some((box) => inside(box, level, x, z))) continue;
          push(level, x, z);
          covered.push({ x: x * level.blocks, z: z * level.blocks, x2: (x + 1) * level.blocks, z2: (z + 1) * level.blocks });
          added += 1;
          if (added >= 256) break;
        }
      }
      for (const level of levels.filter((item) => item.blocks > preferred.blocks)) {
        for (const key of level.lookup) {
          const [x, z] = key.split(":").map(Number);
          if (!hits(level, x, z)) continue;
          const wx = x * level.blocks;
          const wz = z * level.blocks;
          if (covered.some((box) => box.x <= wx && box.z <= wz && box.x2 >= wx + level.blocks && box.z2 >= wz + level.blocks)) continue;
          push(level, x, z);
        }
      }
      return found;
    }

    function applyCamera() {
      const rect = viewEl.getBoundingClientRect();
      const ox = rect.width / 2 - view.x * view.scale;
      const oy = rect.height / 2 - view.z * view.scale;
      camera.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + view.scale + ")";
      camera.style.setProperty("--inv", String(1 / view.scale));
    }

    function syncTiles() {
      const wanted = new Set();
      for (const tile of visibleTiles()) {
        const key = tile.level + ":" + tile.x + ":" + tile.z;
        wanted.add(key);
        const existing = tiles.get(key);
        if (existing) {
          placeTile(tile, existing);
          continue;
        }
        const frame = document.createElement("div");
        const image = document.createElement("img");
        frame.className = "tile";
        image.alt = "";
        image.draggable = false;
        image.src = tileUrl(tile.level, tile.x, tile.z);
        placeTile(tile, frame);
        image.addEventListener("load", () => frame.classList.add("ready"));
        image.addEventListener("error", () => { frame.remove(); tiles.delete(key); });
        frame.appendChild(image);
        camera.appendChild(frame);
        tiles.set(key, frame);
      }
      for (const [key, frame] of tiles) {
        if (!wanted.has(key)) { frame.remove(); tiles.delete(key); }
      }
    }

    function placeTile(tile, frame) {
      const overlap = 2 / Math.max(view.scale, 0.01);
      frame.style.left = tile.worldX + "px";
      frame.style.top = tile.worldZ + "px";
      frame.style.width = (tile.blocks + overlap) + "px";
      frame.style.height = (tile.blocks + overlap) + "px";
      frame.style.zIndex = String(8 - tile.level);
    }

    function pinImage(color, letter) {
      const key = color + "|" + letter;
      if (pinImages.has(key)) return pinImages.get(key);
      const canvas = document.createElement("canvas");
      canvas.width = 30;
      canvas.height = 30;
      const ctx = canvas.getContext("2d");
      PIN_ROWS.forEach((row, y) => {
        for (let x = 0; x < row.length; x += 1) {
          if (row[x] === "0") continue;
          ctx.fillStyle = row[x] === "2" ? "#1b140c" : color;
          ctx.fillRect(x * 2, y * 2, 2, 2);
        }
      });
      const wide = [...letter].length > 1;
      drawCenteredGlyph(ctx, letter, (wide ? "700 9px " : "700 13px ") + '"Pixelify Sans", monospace', 15, 12);
      const url = canvas.toDataURL();
      pinImages.set(key, url);
      return url;
    }

    function drawCenteredGlyph(ctx, letter, font, cx, cy) {
      const scratch = document.createElement("canvas");
      scratch.width = 48;
      scratch.height = 48;
      const pen = scratch.getContext("2d");
      pen.font = font;
      pen.textAlign = "left";
      pen.textBaseline = "top";
      pen.lineWidth = 3;
      pen.lineJoin = "round";
      pen.strokeStyle = "#000000";
      pen.strokeText(letter, 8, 8);
      pen.fillStyle = "#ffffff";
      pen.fillText(letter, 8, 8);
      const pixels = pen.getImageData(0, 0, 48, 48).data;
      let minX = 48;
      let minY = 48;
      let maxX = 0;
      let maxY = 0;
      let any = false;
      for (let y = 0; y < 48; y += 1) {
        for (let x = 0; x < 48; x += 1) {
          if (pixels[(y * 48 + x) * 4 + 3] < 24) continue;
          any = true;
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
      if (!any) return;
      ctx.drawImage(scratch, Math.round(cx - (minX + maxX) / 2), Math.round(cy - (minY + maxY) / 2));
    }

    function biomeLabel(id) {
      if (!id) return "";
      const pair = BIOMES[id];
      if (pair) return text(pair[0], pair[1]);
      return id.split(":").pop().replaceAll("_", " ");
    }

    function mountPins() {
      pins.forEach((pin) => pin.remove());
      pins.clear();
      dimension.waypoints.forEach((marker, index) => {
        const pin = document.createElement("button");
        pin.type = "button";
        pin.className = "pin";
        pin.innerHTML = "<img alt='' draggable='false'>";
        pin.style.setProperty("--x", marker.x + "px");
        pin.style.setProperty("--z", marker.z + "px");
        pin.querySelector("img").src = pinImage(marker.color, marker.initials || "?");
        pin.addEventListener("contextmenu", (event) => openMenu(event, marker));
        camera.appendChild(pin);
        pins.set(index, pin);
      });
    }

    function redraw() {
      frame = 0;
      if (!dimension) return;
      applyCamera();
      syncTiles();
    }

    function requestDraw() {
      if (!frame) frame = requestAnimationFrame(redraw);
    }

    function tightRange(values) {
      let ordered = values.slice().sort((a, b) => a - b);
      while (ordered.length > 4) {
        let best = 0;
        let split = 0;
        for (let i = 1; i < ordered.length; i += 1) {
          const gap = ordered[i] - ordered[i - 1];
          if (gap > best) { best = gap; split = i; }
        }
        if (best < 64) break;
        const left = split;
        const right = ordered.length - split;
        ordered = left >= right ? ordered.slice(0, split) : ordered.slice(split);
      }
      return [ordered[0], ordered[ordered.length - 1]];
    }

    function focusBounds() {
      const finest = dimension.levels.slice().sort((a, b) => a.blocks - b.blocks)[0];
      if (!finest || !finest.tiles.length) return dimension.bounds;
      const [x0, x1] = tightRange(finest.tiles.map((pair) => pair[0]));
      const [z0, z1] = tightRange(finest.tiles.map((pair) => pair[1]));
      return {
        minX: x0 * finest.blocks,
        maxX: (x1 + 1) * finest.blocks,
        minZ: z0 * finest.blocks,
        maxZ: (z1 + 1) * finest.blocks
      };
    }

    function fit(closer) {
      const bounds = focusBounds();
      const width = Math.max(1, bounds.maxX - bounds.minX);
      const height = Math.max(1, bounds.maxZ - bounds.minZ);
      const rect = viewEl.getBoundingClientRect();
      const fitted = Math.min((rect.width - 48) / width, (rect.height - 48) / height);
      view.min = Math.max(fitted * 0.85, 0.0005);
      if (!closer) {
        view.x = (bounds.minX + bounds.maxX) / 2;
        view.z = (bounds.minZ + bounds.maxZ) / 2;
        view.scale = Math.max(view.min, fitted);
        requestDraw();
        return;
      }
      const inside = dimension.waypoints.filter((marker) =>
        marker.x >= bounds.minX && marker.x <= bounds.maxX && marker.z >= bounds.minZ && marker.z <= bounds.maxZ
      );
      const source = inside.length ? inside : [{ x: (bounds.minX + bounds.maxX) / 2, z: (bounds.minZ + bounds.maxZ) / 2 }];
      const xs = source.map((marker) => marker.x).sort((a, b) => a - b);
      const zs = source.map((marker) => marker.z).sort((a, b) => a - b);
      const mid = (xs.length - 1) >> 1;
      view.x = xs[mid];
      view.z = zs[mid];
      view.scale = Math.min(view.max, Math.max(view.min, 0.5));
      requestDraw();
    }

    function zoomAt(clientX, clientY, factor) {
      const [worldX, worldZ] = blockOf(clientX, clientY);
      view.scale = Math.min(view.max, Math.max(view.min, view.scale * factor));
      const rect = viewEl.getBoundingClientRect();
      view.x = worldX - (clientX - rect.left - rect.width / 2) / view.scale;
      view.z = worldZ - (clientY - rect.top - rect.height / 2) / view.scale;
      requestDraw();
    }

    function goTo(marker) {
      view.x = marker.x;
      view.z = marker.z;
      view.scale = Math.min(view.max, Math.max(view.min, 1));
      searchList.hidden = true;
      searchInput.value = marker.name;
      menu.hidden = true;
      hover.hidden = true;
      requestDraw();
    }

    function matchingMarkers() {
      const needle = searchInput.value.trim().toLowerCase();
      if (!needle || !dimension) return [];
      const markers = dimension.waypoints.filter((marker) => marker.name.toLowerCase().includes(needle)).slice(0, 8);
      const biomes = (dimension.biomes || []).filter((spot) => {
        const pair = BIOMES[spot.id] || [];
        const haystack = (spot.id + " " + pair.join(" ") + " " + biomeLabel(spot.id)).toLowerCase();
        return haystack.includes(needle);
      }).slice(0, 8);
      return markers.map((marker) => ({ kind: "marker", name: marker.name, x: marker.x, z: marker.z }))
        .concat(biomes.map((spot) => ({
          kind: "biome",
          name: biomeLabel(spot.id),
          x: spot.x,
          z: spot.z
        })))
        .slice(0, 12);
    }

    function renderSearch() {
      const found = matchingMarkers();
      searchList.replaceChildren();
      if (!found.length) { searchList.hidden = true; return; }
      if (searchPick >= found.length) searchPick = found.length - 1;
      searchList.hidden = false;
      found.forEach((marker, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = index === searchPick ? "on" : "";
        const place = "  X " + marker.x + "  Z " + marker.z;
        button.textContent = marker.kind === "biome" ? marker.name + place : marker.name;
        button.addEventListener("mousedown", (event) => event.preventDefault());
        button.addEventListener("click", () => goTo(marker));
        searchList.appendChild(button);
      });
    }

    let warmToken = 0;

    function preload(url) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve();
        image.onerror = () => resolve();
        image.src = url;
      });
    }

    async function warm() {
      const token = ++warmToken;
      const opening = visibleTiles();
      loading.hidden = false;
      readout.hidden = true;
      if (!opening.length) {
        loading.hidden = true;
        readout.hidden = false;
        return;
      }
      let finished = 0;
      await Promise.all(opening.map((tile) => preload(tileUrl(tile.level, tile.x, tile.z)).then(() => {
        finished += 1;
        if (token !== warmToken) return;
        loadingLabel.textContent = text("Tiles " + finished + " / " + opening.length, "Тайлы " + finished + " / " + opening.length);
        loadingBar.style.width = (12 + 88 * finished / opening.length) + "%";
      })));
      if (token !== warmToken) return;
      loading.hidden = true;
      readout.hidden = false;
    }

    function showDimension(id) {
      dimension = catalog.dimensions.find((item) => item.id === id) || catalog.dimensions[0];
      tiles.forEach((image) => image.remove());
      tiles.clear();
      for (const button of bar.querySelectorAll(".dim")) {
        button.setAttribute("aria-pressed", button.dataset.id === dimension.id ? "true" : "false");
      }
      menu.hidden = true;
      hover.hidden = true;
      searchList.hidden = true;
      searchInput.value = "";
      biomeRegions.clear();
      biomeEl.textContent = "";
      mountPins();
      fit(true);
      warm();
    }

    function markerAt(clientX, clientY) {
      const [x, z] = blockOf(clientX, clientY);
      const reach = 22 / view.scale;
      let best = reach * reach;
      let found = null;
      for (const marker of dimension.waypoints) {
        const dx = marker.x - x;
        const dz = marker.z - z;
        const distance = dx * dx + dz * dz;
        if (distance < best) { best = distance; found = marker; }
      }
      return found;
    }

    function placePopup(node, clientX, clientY) {
      node.hidden = false;
      node.style.left = "0px";
      node.style.top = "0px";
      const box = node.getBoundingClientRect();
      const rect = viewEl.getBoundingClientRect();
      let left = clientX + 14;
      let top = clientY + 14;
      if (left + box.width > rect.right - 8) left = clientX - box.width - 14;
      if (top + box.height > rect.bottom - 8) top = clientY - box.height - 14;
      node.style.left = Math.max(8, left) + "px";
      node.style.top = Math.max(8, top) + "px";
    }

    function showHover(event, marker) {
      if (!marker || drag) { hover.hidden = true; return; }
      hover.querySelector("strong").textContent = marker.name;
      const height = marker.y == null ? "" : "  Y " + marker.y;
      hover.querySelector("span").textContent = "X " + marker.x + height + "  Z " + marker.z;
      placePopup(hover, event.clientX, event.clientY);
    }

    function openMenu(event, marker) {
      event.preventDefault();
      event.stopPropagation();
      hover.hidden = true;
      const point = marker || null;
      const [x, z] = point ? [point.x, point.z] : blockOf(event.clientX, event.clientY).map(Math.round);
      const y = point ? point.y : null;
      menu.innerHTML = "";
      const title = document.createElement("strong");
      title.textContent = point ? point.name : text("Empty place", "Пустое место");
      menu.appendChild(title);
      const place = document.createElement("div");
      const ground = biomeNow(x, z);
      place.textContent = "X " + x + (y === null ? "" : "  Y " + y) + "  Z " + z + (ground ? "  " + ground : "");
      menu.appendChild(place);
      if (!point) field(text("Suggest a marker", "Предложить метку"), "add", x, y, z, "");
      else {
        field(text("Suggest a rename", "Предложить переименовать"), "rename", x, y, z, point.name);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = text("Suggest removal", "Предложить удалить");
        remove.addEventListener("click", () => send({ kind: "delete", dimension: dimension.id, x, y, z, name: "", waypoint: point.name }));
        menu.appendChild(remove);
      }
      placePopup(menu, event.clientX, event.clientY);
    }

    function field(label, kind, x, y, z, waypoint) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      const input = document.createElement("input");
      input.maxLength = 80;
      input.placeholder = text("Name", "Имя");
      input.value = kind === "rename" ? waypoint : "";
      const save = document.createElement("button");
      save.type = "submit";
      save.textContent = text("Save", "Записать");
      button.addEventListener("click", () => { input.hidden = false; save.hidden = false; input.focus(); });
      save.addEventListener("click", (event) => {
        event.preventDefault();
        send({ kind, dimension: dimension.id, x, y, z, name: input.value, waypoint });
      });
      input.hidden = true;
      save.hidden = true;
      menu.append(button, input, save);
    }

    async function send(body) {
      const response = await fetch(api("api/suggestions"), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body)
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        say(errors[payload.error] || errors.store);
        return;
      }
      menu.hidden = true;
      say(text("Saved. It is only a suggestion.", "Записано. Это только предложение."));
    }

    function regionKey(x, z) {
      return dimension.id + ":" + Math.floor(x / 512) + ":" + Math.floor(z / 512);
    }

    async function inflateCells(cells) {
      if (!cells) return new Uint8Array(0);
      const raw = Uint8Array.from(atob(cells), (char) => char.charCodeAt(0));
      const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate"));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    function loadRegion(x, z) {
      const key = regionKey(x, z);
      const existing = biomeRegions.get(key);
      if (existing) return Promise.resolve(existing);
      const rx = Math.floor(x / 512);
      const rz = Math.floor(z / 512);
      const pending = fetch(api("api/biomes/region?dimension=" + encodeURIComponent(dimension.id) + "&x=" + (rx * 512) + "&z=" + (rz * 512)))
        .then((response) => response.ok ? response.json() : null)
        .then(async (payload) => {
          const grid = {
            names: payload && payload.names || [],
            cells: payload && payload.cells ? await inflateCells(payload.cells) : new Uint8Array(0)
          };
          biomeRegions.set(key, grid);
          return grid;
        })
        .catch(() => {
          const grid = { names: [], cells: new Uint8Array(0) };
          biomeRegions.set(key, grid);
          return grid;
        });
      biomeRegions.set(key, pending);
      return pending;
    }

    function sampleBiome(grid, x, z) {
      if (!grid || !grid.cells || grid.cells.length !== 65536) return "";
      const rx = Math.floor(x / 512);
      const rz = Math.floor(z / 512);
      const localX = Math.floor(x) - rx * 512;
      const localZ = Math.floor(z) - rz * 512;
      if (localX < 0 || localX > 511 || localZ < 0 || localZ > 511) return "";
      const value = grid.cells[(localZ >> 1) * 256 + (localX >> 1)];
      if (!value || value > grid.names.length) return "";
      return biomeLabel(grid.names[value - 1] || "");
    }

    function biomeNow(x, z) {
      const value = biomeRegions.get(regionKey(x, z));
      if (!value || typeof value.then === "function") return "";
      return sampleBiome(value, x, z);
    }

    let readoutSeq = 0;

    function pointerReadout(event) {
      if (!dimension) return;
      const [x, z] = blockOf(event.clientX, event.clientY);
      const seq = ++readoutSeq;
      coordsEl.textContent = "X " + Math.round(x) + "  Z " + Math.round(z);
      const ready = biomeRegions.get(regionKey(x, z));
      if (ready && typeof ready.then !== "function") biomeEl.textContent = sampleBiome(ready, x, z);
      else {
        biomeEl.textContent = "";
        loadRegion(x, z).then((grid) => {
          if (seq !== readoutSeq) return;
          biomeEl.textContent = sampleBiome(grid, x, z);
        });
      }
      showHover(event, markerAt(event.clientX, event.clientY));
    }

    viewEl.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      menu.hidden = true;
      drag = { id: event.pointerId, x: event.clientX, z: event.clientY, vx: view.x, vz: view.z };
      viewEl.classList.add("drag");
      hover.hidden = true;
      viewEl.setPointerCapture(event.pointerId);
    });
    viewEl.addEventListener("pointermove", (event) => {
      pointerReadout(event);
      if (!drag || drag.id !== event.pointerId) return;
      view.x = drag.vx - (event.clientX - drag.x) / view.scale;
      view.z = drag.vz - (event.clientY - drag.z) / view.scale;
      requestDraw();
    });
    viewEl.addEventListener("pointerup", (event) => {
      const moved = drag && (Math.abs(event.clientX - drag.x) > 4 || Math.abs(event.clientY - drag.z) > 4);
      drag = null;
      viewEl.classList.remove("drag");
      if (moved || event.button !== 0) return;
      const marker = markerAt(event.clientX, event.clientY);
      if (marker) copyCoords(marker);
    });
    viewEl.addEventListener("pointerleave", () => { hover.hidden = true; });
    viewEl.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoomAt(event.clientX, event.clientY, event.deltaY < 0 ? 1.15 : 1 / 1.15);
    }, { passive: false });
    viewEl.addEventListener("contextmenu", (event) => openMenu(event, markerAt(event.clientX, event.clientY)));
    viewEl.addEventListener("dblclick", (event) => zoomAt(event.clientX, event.clientY, 2));
    window.addEventListener("resize", requestDraw);
    window.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      menu.hidden = true;
      searchList.hidden = true;
    });
    menu.addEventListener("submit", (event) => event.preventDefault());
    searchInput.addEventListener("input", () => { searchPick = 0; renderSearch(); });
    searchInput.addEventListener("keydown", (event) => {
      const found = matchingMarkers();
      if (event.key === "ArrowDown") {
        event.preventDefault();
        searchPick = Math.min(found.length - 1, searchPick + 1);
        renderSearch();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        searchPick = Math.max(0, searchPick - 1);
        renderSearch();
      } else if (event.key === "Enter") {
        event.preventDefault();
        const marker = found[searchPick] || found[0];
        if (marker) goTo(marker);
      }
    });

    function tool(label, action) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.addEventListener("click", action);
      bar.appendChild(button);
      return button;
    }

    async function boot() {
      if (started) return;
      started = true;
      loadingLabel.textContent = text("Reading the catalog", "Читаю каталог");
      loadingBar.style.width = "8%";
      let response;
      try {
        response = await fetch(api("api/map"));
        catalog = await response.json();
      } catch (error) {
        catalog = {};
        response = { ok: false };
      }
      if (response.status === 401) {
        started = false;
        document.body.classList.add("locked");
        document.getElementById("gate").hidden = false;
        loading.hidden = true;
        return;
      }
      if (!response.ok || !catalog.dimensions || !catalog.dimensions.length) {
        loading.hidden = true;
        empty.hidden = false;
        empty.textContent = text("The map is not published yet.", "Карта ещё не опубликована.");
        return;
      }
      const names = {
        overworld: text("Overworld", "Верхний мир"),
        nether: text("Nether", "Незер"),
        end: text("End", "Край")
      };
      for (const item of catalog.dimensions) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "dim";
        button.dataset.id = item.id;
        button.textContent = names[item.id] || item.id;
        button.addEventListener("click", () => showDimension(item.id));
        bar.insertBefore(button, document.getElementById("search"));
      }
      tool("+", () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25));
      tool("−", () => zoomAt(innerWidth / 2, innerHeight / 2, 0.8));
      tool(text("Whole map", "Вся карта"), () => fit(false));
      showDimension(catalog.dimensions[0].id);
    }

    function copyCoords(marker) {
      const parts = [String(marker.x)];
      if (marker.y !== null && marker.y !== undefined) parts.push(String(marker.y));
      parts.push(String(marker.z));
      const value = parts.join(" ");
      const done = () => say(text("Coordinates copied", "Координаты скопированы"));
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done).catch(() => fallbackCopy(value, done));
        return;
      }
      fallbackCopy(value, done);
    }

    function fallbackCopy(value, done) {
      const area = document.createElement("textarea");
      area.value = value;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.left = "-999px";
      document.body.appendChild(area);
      area.select();
      try { document.execCommand("copy"); done(); } catch (error) { /* the notice stays quiet if the browser blocks it */ }
      area.remove();
    }

    let started = false;
    const loggedOut = fetch(api("api/logout"), { method: "POST", credentials: "same-origin" }).catch(() => null);

    document.getElementById("gate").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const input = document.getElementById("key");
      const error = document.getElementById("gate-error");
      await loggedOut;
      const response = await fetch(api("api/access"), {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ key: input.value })
      }).catch(() => null);
      if (!response || !response.ok) {
        error.textContent = response && response.status === 429
          ? text("Too many tries. Wait a little.", "Слишком много попыток. Подождите.")
          : text("Wrong key.", "Неверный ключ.");
        return;
      }
      error.textContent = "";
      document.body.classList.remove("locked");
      form.hidden = true;
      boot();
    });

    document.fonts.ready.then(() => {
      pinImages.clear();
      if (dimension) mountPins();
    });
  </script>
</body>
</html>
