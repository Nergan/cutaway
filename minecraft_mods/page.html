<!DOCTYPE html>
<html lang="__LANG__">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__TITLE__</title>
  <link rel="icon" type="image/jpeg" href="https://cdn.jsdelivr.net/gh/Nergan/cdn@main/mods/favicon.jpg">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--sb-thumb) var(--sb-track);
    }

    :root {
      --bg: #383431;
      --container-bg: #423e3b;
      --card-bg: #4a3c31;
      --primary: #d4a373;
      --accent: #d98a59;
      --text: #e5e1db;
      --text-muted: #b5aba4;
      --border: #665f5a;
      --btn-bg: #524a44;
      --sb-track: #332d29;
      --sb-thumb: #7d736c;
      --selection-bg: #d4a373;
      --selection-color: #1a1614;
      --focus-ring: #d98a59;
      --radius: 6px;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: Verdana, Arial, Helvetica, sans-serif;
      font-size: 10pt;
      line-height: 1.6;
      padding: 20px;
    }

    ::selection {
      background: var(--selection-bg);
      color: var(--selection-color);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--sb-track);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--sb-thumb);
      border-radius: var(--radius);
    }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 1px;
    }

    .app-container,
    .section,
    .pill,
    .btn,
    .form-control,
    .select-trigger,
    .select-options-panel,
    .note {
      border-radius: var(--radius);
    }

    .app-container {
      max-width: 920px;
      margin: 0 auto;
      background-color: var(--container-bg);
      border: 1px solid var(--border);
      padding: 25px;
    }

    .app-header {
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .brand-title {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 22pt;
      color: var(--primary);
    }
    .brand-tagline {
      color: var(--text-muted);
      font-size: 9pt;
      margin-top: 4px;
    }

    .app-nav {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .nav-link {
      color: var(--accent);
      text-decoration: underline;
      font-size: 9pt;
    }
    .nav-link:hover, .nav-link:focus-visible {
      color: #e65c5c;
      text-decoration: none;
    }
    .nav-link.is-current {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      background-color: var(--card-bg);
      border: 1px solid #7a6352;
      padding: 15px;
      margin-bottom: 16px;
    }
    .section h2 {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 14pt;
      color: var(--primary);
      margin: 0;
    }

    .mod-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .mod-desc {
      margin-bottom: 10px;
    }
    .mod-desc code, .file-name {
      font-family: Consolas, "Courier New", monospace;
      font-size: 9pt;
      background: #332d29;
      padding: 0 3px;
      border-radius: 3px;
    }

    .pill-group, .mod-links, .file-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .pill-group { margin-top: 0; }
    .pill {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      font-size: 8pt;
    }
    .mod-links, .mod-files { margin-top: 10px; }
    .file-row + .file-row { margin-top: 8px; }
    .file-label {
      color: var(--text-muted);
      font-size: 8pt;
      min-width: 8.5em;
    }
    .mod-note {
      color: var(--accent);
      font-size: 9pt;
      margin-top: 8px;
    }
    .note {
      background: #332d29;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 10px;
      margin-bottom: 16px;
      font-size: 9pt;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }
    label {
      font-size: 9pt;
      color: #e8dbce;
    }
    .form-control {
      background-color: #332d29;
      border-top: 1px solid #221d1a;
      border-left: 1px solid #221d1a;
      border-bottom: 1px solid #665f5a;
      border-right: 1px solid #665f5a;
      color: #e5e1db;
      padding: 5px 8px;
      font-family: Verdana, Arial, sans-serif;
      font-size: 9pt;
      outline: none;
      width: 100%;
    }
    .form-control:focus {
      border-color: var(--accent);
    }

    .custom-select {
      position: relative;
      user-select: none;
    }
    .select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background-color: #332d29;
      border-top: 1px solid #221d1a;
      border-left: 1px solid #221d1a;
      border-bottom: 1px solid #665f5a;
      border-right: 1px solid #665f5a;
      color: #e5e1db;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 9pt;
    }
    .select-arrow {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--primary);
      transition: transform 0.15s ease;
      flex: 0 0 auto;
    }
    .custom-select.open .select-arrow {
      transform: rotate(180deg);
    }
    .select-options-panel {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      right: 0;
      z-index: 999;
      background-color: #423e3b;
      border: 1px solid #7a6352;
      box-shadow: 2px 2px 0 #1a1614;
      display: none;
      max-height: 180px;
      overflow-y: auto;
    }
    .custom-select.open .select-options-panel {
      display: block;
    }
    .select-option {
      padding: 6px 10px;
      cursor: pointer;
      font-size: 9pt;
      color: var(--text);
    }
    .select-option:hover,
    .select-option.focused {
      background-color: #524a44;
      color: #ffffff;
    }
    .select-option.selected {
      background-color: var(--card-bg);
      color: var(--primary);
      font-weight: bold;
    }

    .btn {
      background-color: var(--btn-bg);
      border-top: 2px solid #7d736c;
      border-left: 2px solid #7d736c;
      border-bottom: 2px solid #332d29;
      border-right: 2px solid #332d29;
      color: var(--text);
      padding: 4px 12px;
      font-family: Verdana, Arial, sans-serif;
      font-size: 9pt;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover, .btn:focus-visible { color: #ffffff; }
    .btn:active {
      border-top: 2px solid #332d29;
      border-left: 2px solid #332d29;
      border-bottom: 2px solid #7d736c;
      border-right: 2px solid #7d736c;
      background-color: #423e3b;
    }
    .btn-primary { color: var(--primary); font-weight: bold; }
    .is-hidden { display: none; }

    .app-footer {
      font-size: 8pt;
      color: var(--text-muted);
      text-align: center;
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .app-container { padding: 15px; }
      .brand-title { font-size: 18pt; }
      .file-label { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
__APP__
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const cards = Array.from(document.querySelectorAll(".mod-card"));
    const empty = document.getElementById("filter-empty");
    const search = document.getElementById("mod-search");
    let loader = "all";

    const applyFilter = () => {
      const query = (search && search.value || "").trim().toLowerCase();
      let shown = 0;
      cards.forEach((card) => {
        const loaders = (card.getAttribute("data-loaders") || "").toLowerCase();
        const text = card.textContent.toLowerCase();
        const loaderOk = loader === "all" || loaders.split(/\s+/).includes(loader);
        const textOk = !query || text.includes(query);
        const visible = loaderOk && textOk;
        card.classList.toggle("is-hidden", !visible);
        if (visible) shown += 1;
      });
      if (empty) empty.classList.toggle("is-hidden", shown !== 0 || cards.length === 0);
    };

    document.querySelectorAll(".custom-select").forEach((select) => {
      const trigger = select.querySelector(".select-trigger");
      const selectedText = select.querySelector(".selected-text");
      const options = Array.from(select.querySelectorAll(".select-option"));
      let activeIndex = options.findIndex((opt) => opt.classList.contains("selected"));

      const toggleDropdown = (open) => {
        const isOpen = open !== undefined ? open : !select.classList.contains("open");
        select.classList.toggle("open", isOpen);
        select.setAttribute("aria-expanded", isOpen);
      };

      const selectOption = (index) => {
        if (index < 0 || index >= options.length) return;
        options.forEach((opt, i) => {
          const isSelected = i === index;
          opt.classList.toggle("selected", isSelected);
          opt.setAttribute("aria-selected", isSelected);
          opt.classList.remove("focused");
        });
        selectedText.textContent = options[index].textContent;
        activeIndex = index;
        toggleDropdown(false);
        const href = options[index].getAttribute("data-href");
        const filter = options[index].getAttribute("data-filter");
        if (href) {
          window.location.assign(href);
          return;
        }
        if (filter) {
          loader = filter;
          applyFilter();
        }
      };

      trigger.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleDropdown();
      });
      options.forEach((opt, index) => {
        opt.addEventListener("click", (event) => {
          event.stopPropagation();
          selectOption(index);
        });
      });
      select.addEventListener("keydown", (event) => {
        const isOpen = select.classList.contains("open");
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          if (!isOpen) toggleDropdown(true);
          else if (activeIndex >= 0) selectOption(activeIndex);
        } else if (event.key === "Escape") {
          toggleDropdown(false);
        } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (!isOpen) {
            toggleDropdown(true);
            return;
          }
          const step = event.key === "ArrowDown" ? 1 : -1;
          activeIndex = (activeIndex + step + options.length) % options.length;
          options.forEach((opt, idx) => opt.classList.toggle("focused", idx === activeIndex));
        }
      });
    });

    document.addEventListener("click", () => {
      document.querySelectorAll(".custom-select.open").forEach((select) => {
        select.classList.remove("open");
        select.setAttribute("aria-expanded", "false");
      });
    });

    if (search) search.addEventListener("input", applyFilter);
  });
</script>
</body>
</html>
