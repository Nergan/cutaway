<!DOCTYPE html>
<html lang="__LANG__">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__TITLE__</title>
  <link rel="icon" type="image/jpeg" href="https://cdn.jsdelivr.net/gh/Nergan/cdn@main/mods/favicon.jpg">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--sb-thumb) var(--sb-track);
    }

    :root {
      --bg: #383431;
      --card: #4a3c31;
      --inset: #332d29;
      --primary: #d4a373;
      --accent: #d98a59;
      --text: #e5e1db;
      --text-muted: #b5aba4;
      --border: #665f5a;
      --btn: #524a44;
      --sb-track: #332d29;
      --sb-thumb: #7d736c;
      --selection-bg: #d4a373;
      --selection-color: #1a1614;
      --focus-ring: #d98a59;
      --radius: 6px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Verdana, Arial, Helvetica, sans-serif;
      font-size: 10pt;
      line-height: 1.5;
      padding: 28px 16px 40px;
    }

    ::selection {
      background: var(--selection-bg);
      color: var(--selection-color);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--sb-track);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--sb-thumb);
      border-radius: var(--radius);
    }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 1px;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
    }

    .mast {
      margin: 0 0 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18pt;
      line-height: 1.3;
      text-align: center;
    }

    .mast p {
      margin: 0;
    }

    .by {
      color: var(--text);
      text-decoration: none;
    }

    .by em {
      font-style: italic;
    }

    .by:hover em,
    .by:focus-visible em {
      color: var(--accent);
    }

    .lang {
      margin-left: 0.6em;
      font-family: Verdana, Arial, Helvetica, sans-serif;
      font-size: 8pt;
      color: var(--text-muted);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .mod {
      margin: 0 0 12px;
      padding: 12px 14px 13px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .mod h2 {
      display: inline;
      margin: 0 0.55em 0 0;
      font-size: 13pt;
      font-weight: bold;
      line-height: 1.35;
    }

    .meta,
    .kind,
    .note,
    .stamp {
      color: var(--text-muted);
    }

    .meta {
      font-size: 8.5pt;
    }

    .desc,
    .links,
    .files,
    .note,
    .license {
      margin: 8px 0 0;
    }

    .desc {
      margin-top: 6px;
    }

    a.inline {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .links,
    .files {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
    }

    .kind {
      font-size: 8pt;
      margin-right: 2px;
    }

    a.btn {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      font-size: 8.5pt;
      line-height: 1.45;
      text-decoration: none;
    }

    a.btn.ext {
      background: transparent;
      border-color: var(--accent);
      color: var(--accent);
    }

    a.btn.ext::after {
      content: " \2197";
      font-size: 0.85em;
    }

    a.btn.jar {
      border-style: dashed;
      border-color: var(--primary);
      color: var(--primary);
      font-family: Consolas, "Courier New", monospace;
    }

    a.btn.jar::before {
      content: "\2193 ";
    }

    a.btn:hover,
    a.btn:focus-visible {
      filter: brightness(1.12);
    }

    details.license {
      margin-top: 8px;
    }

    details.license summary {
      cursor: pointer;
      color: var(--text-muted);
      font-size: 8.5pt;
    }

    .license-text {
      margin: 6px 0 0;
      max-height: 9em;
      overflow: auto;
      white-space: pre-wrap;
      font-family: "Courier New", Courier, monospace;
      font-size: 8pt;
      line-height: 1.4;
      color: var(--text-muted);
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
    }

    code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95em;
    }

    .stamp {
      margin-top: 14px;
      font-size: 8pt;
      text-align: center;
    }
  </style>
</head>
<body>
  __APP__
</body>
</html>
