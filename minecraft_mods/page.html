<!DOCTYPE html>
<html lang="__LANG__">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__TITLE__</title>
  <link rel="icon" type="image/jpeg" href="https://cdn.jsdelivr.net/gh/Nergan/cdn@main/mods/favicon.jpg">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--sb-thumb) var(--sb-track);
    }

    :root {
      --bg: #2c2825;
      --card: #3a342f;
      --inset: #241f1c;
      --primary: #d4a373;
      --accent: #e0a36a;
      --visited: #b5836a;
      --text: #e5e1db;
      --text-muted: #a89e96;
      --border: #665f5a;
      --sb-track: #332d29;
      --sb-thumb: #7d736c;
      --selection-bg: #d4a373;
      --selection-color: #1a1614;
      --focus-ring: #d98a59;
      --radius: 2px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Verdana, Tahoma, Arial, sans-serif;
      font-size: 9pt;
      line-height: 1.45;
      padding: 16px 18px 28px;
    }

    ::selection {
      background: var(--selection-bg);
      color: var(--selection-color);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--sb-track);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--sb-thumb);
      border-radius: var(--radius);
    }

    :focus-visible {
      outline: 1px dotted var(--focus-ring);
      outline-offset: 2px;
    }

    .mast,
    .mods,
    .note,
    .stamp {
      max-width: 42em;
    }

    .mast {
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15pt;
      line-height: 1.3;
    }

    .mast p {
      margin: 0;
    }

    .by {
      color: var(--text);
      text-decoration: none;
    }

    .by em {
      font-style: italic;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .by:hover em,
    .by:focus-visible em {
      color: var(--accent);
    }

    .lang {
      margin-left: 0.7em;
      font-family: Verdana, Tahoma, Arial, sans-serif;
      font-size: 8pt;
      font-style: normal;
      color: var(--text-muted);
      text-decoration: underline;
    }

    .mod {
      margin: 0 0 8px;
      padding: 6px 8px 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .mod h2 {
      display: inline;
      margin: 0 0.55em 0 0;
      font-size: 11pt;
      font-weight: bold;
      line-height: 1.3;
    }

    .meta,
    .kind,
    .note,
    .stamp {
      color: var(--text-muted);
    }

    .meta {
      font-size: 8pt;
      white-space: nowrap;
    }

    .desc,
    .links,
    .files,
    .note,
    .stamp,
    .license {
      margin: 3px 0 0;
    }

    .desc {
      font-size: 9pt;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15em 0.9em;
    }

    a.ext {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    a.ext:visited {
      color: var(--visited);
    }

    a.ext::after {
      content: " \2197";
      font-size: 0.85em;
      text-decoration: none;
    }

    .files {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.15em 0.7em;
    }

    .kind {
      font-size: 8pt;
    }

    a.jar {
      font-family: Consolas, "Courier New", monospace;
      font-size: 8.5pt;
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px dashed var(--primary);
    }

    a.jar:visited {
      color: #c4b39a;
      border-bottom-color: #c4b39a;
    }

    a.jar::before {
      content: "\2193 ";
      text-decoration: none;
    }

    .license-text {
      margin: 3px 0 0;
      max-height: 5.4em;
      overflow: auto;
      white-space: pre-wrap;
      font-family: "Courier New", Courier, monospace;
      font-size: 8pt;
      line-height: 1.35;
      color: var(--text-muted);
      background: var(--inset);
      border: 1px solid var(--border);
      padding: 4px 6px;
    }

    code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95em;
    }

    .stamp {
      margin-top: 10px;
      font-size: 8pt;
    }
  </style>
</head>
<body>
  __APP__
</body>
</html>
