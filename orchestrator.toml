schema_version = 1
default_profile = "local"

[orchestrator]
worker_host = "127.0.0.1"
worker_base_port = 8100
monitor_interval_seconds = 2.0
shutdown_grace_seconds = 10.0
global_memory_budget_mb = 12288

[profiles.local]
isolation = "embedded"
dependency_isolation = false
global_memory_budget_mb = 0

[profiles.hf]
isolation = "isolated"
dependency_isolation = true
global_memory_budget_mb = 12288

[profiles.render]
isolation = "isolated"
dependency_isolation = true
global_memory_budget_mb = 16384

[projects.formular]
directory = "formular"
entrypoint = "formular.formular"
prefix = "/formular"
requirements = "formular/requirements.txt"
startup = "lazy"
env_allowlist = [
  "FORMULAR_MAX_UPLOAD_BYTES",
  "FORMULAR_MAX_OUTPUT_BYTES",
  "FORMULAR_SESSION_TTL_SECONDS",
  "FORMULAR_MAX_CONCURRENT_JOBS",
  "FORMULAR_MAX_ARCHIVE_FILES",
  "FORMULAR_MAX_ARCHIVE_UNPACKED_BYTES",
]

[projects.formular.limits]
request_rate = 20
request_window_seconds = 60
request_bytes = 268435456
response_bytes = 536870912
max_concurrency = 2
queue_timeout_seconds = 5
request_timeout_seconds = 600
memory_mb = 4096
cpu_percent = 180
cpu_grace_seconds = 30
max_processes = 16
max_connections = 32
temp_mb = 2048
idle_timeout_seconds = 900
startup_timeout_seconds = 30
restart_max = 3
restart_window_seconds = 300
restart_backoff_seconds = 5
nofile = 256
fsize_mb = 1024

[projects.formular.network]
allowed_hosts = []
allow_private = false
requests_per_minute = 0

[projects.toadcode]
directory = "toadcode"
entrypoint = "toadcode.toadcode"
prefix = "/toadcode"
requirements = "toadcode/requirements.txt"
startup = "lazy"
env_allowlist = ["MONGODB_URI", "MONGO_MAX_POOL_SIZE", "MONGO_TLS", "MONGO_TLS_ALLOW_INVALID_CERTS"]

[projects.toadcode.limits]
request_rate = 60
request_window_seconds = 60
request_bytes = 10485760
response_bytes = 83886080
max_concurrency = 8
request_timeout_seconds = 60
memory_mb = 768
cpu_percent = 100
max_processes = 4
max_connections = 32
idle_timeout_seconds = 900

[projects.toadcode.network]
allowed_hosts = ["github.com", "codeload.github.com", "*.githubusercontent.com", "huggingface.co", "hf.co"]
allow_private = false
requests_per_minute = 30

