<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Soon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234a3c31'/%3E%3Cpath d='M3 12c3-6 7-8 10-8' stroke='%23d4a373' stroke-width='1.6' fill='none'/%3E%3Ccircle cx='12.5' cy='4' r='1.3' fill='%23d98a59'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #7d736c #332d29; }
    :root {
      --bg: #383431; --panel: #423e3b; --card: #4a3c31; --primary: #d4a373; --accent: #d98a59;
      --text: #e5e1db; --muted: #b5aba4; --border: #665f5a;       --btn: #524a44; --radius: 6px; --sidebar-w: 228px; --toggle-w: 26px;
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-r: env(safe-area-inset-right, 0px);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Verdana, Arial, Helvetica, sans-serif; font-size: 10pt; overflow: hidden; }
    ::selection { background: var(--primary); color: #1a1614; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .app { height: 100%; height: 100dvh; position: relative; }
    .stage { position: absolute; inset: 0; background: #2b2725; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .sidebar {
      position: absolute; top: 0; right: 0; bottom: 0; width: var(--sidebar-w); z-index: 8;
      background: var(--panel); border-left: 1px solid var(--border);
      overflow-y: auto; padding: 0 8px; padding-right: calc(8px + var(--safe-r));
      display: flex; flex-direction: column; gap: 6px; pointer-events: none;
      transform: translateX(0); transition: transform 0.18s ease;
    }
    .sidebar > * { pointer-events: auto; }
    .sidebar > :first-child { padding-top: 8px; }
    .sidebar > :last-child { padding-bottom: 8px; }
    .app.collapsed .sidebar { transform: translateX(100%); }
    .sidebar-toggle {
      position: absolute; top: 0; bottom: 0; right: 0; z-index: 9;
      width: var(--toggle-w); height: auto; min-height: 0; padding: 0;
      border-radius: 0;
      background: var(--panel); border: 1px solid var(--border); border-right: none;
      color: var(--primary); font-size: 12pt; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: right 0.18s ease;
    }
    .app:not(.collapsed) .sidebar-toggle { right: var(--sidebar-w); }
    .brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .brand { font-family: "Trebuchet MS", Arial, sans-serif; font-size: 13pt; color: var(--primary); line-height: 1; }
    .lang { display: flex; gap: 2px; }
    .lang .btn { min-height: 22px; padding: 2px 7px; font-size: 8pt; }
    .tagline { color: var(--muted); font-size: 8pt; }
    .section-title { font-size: 8pt; color: var(--muted); }
    .tool-group { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 4px; min-width: 0;
    }
    .icon-btn .bi { font-size: 12pt; line-height: 1; }
    .btn {
      background: var(--btn); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); padding: 4px 5px; font-family: Verdana, Arial, sans-serif;
      font-size: 8pt; cursor: pointer; min-height: 26px;
    }
    .btn.active, .btn:active { background: var(--card); color: var(--primary); border-color: var(--accent); }
    .form-control {
      width: 100%; background: #332d29; border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); padding: 5px 7px; font-family: Verdana, Arial, sans-serif; font-size: 8pt;
    }
    label.meta { font-size: 8pt; color: #e8dbce; display: block; margin-bottom: 3px; }
    .range-control { accent-color: var(--accent); width: 100%; cursor: pointer; }
    .spectrum { display: flex; flex-direction: column; gap: 4px; }
    .spectrum canvas { width: 100%; display: block; border-radius: var(--radius); cursor: crosshair; border: 1px solid var(--border); }
    #sv-canvas { height: 56px; }
    #hue-canvas { height: 12px; }
    .people { display: flex; flex-direction: column; gap: 4px; max-height: 72px; overflow-y: auto; }
    .person {
      display: flex; align-items: center; gap: 6px; text-align: left; background: #332d29;
      border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 7px;
      color: var(--text); cursor: pointer; font-size: 8pt;
    }
    .person .bi { font-size: 10pt; line-height: 1; flex-shrink: 0; }
    .person.me { border-color: var(--accent); }
    .nick-row { display: flex; gap: 4px; }
    .nick-row .form-control { flex: 1; }
    .nick-row .btn { min-height: 28px; min-width: 28px; flex: 0 0 28px; padding: 4px; }
    .extras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .help-text { font-size: 8pt; color: var(--muted); line-height: 1.35; }
    .toast {
      position: absolute; left: 12px; bottom: 36px; background: var(--card); border: 1px solid #7a6352;
      color: var(--text); padding: 6px 10px; font-size: 8pt; display: none; z-index: 6;
      max-width: 70%; border-radius: var(--radius);
    }
    .statusbar {
      position: absolute; left: 10px; bottom: calc(8px + var(--safe-b)); z-index: 5;
      background: transparent; border: none; padding: 0; pointer-events: none;
      color: #6e6964; font-size: 8pt;
      -webkit-text-stroke: 2px #1f1b18; paint-order: stroke fill;
      text-shadow: 0 0 2px #1f1b18;
    }
    .chat {
      position: absolute; left: 10px; bottom: calc(26px + var(--safe-b)); z-index: 6;
      width: min(440px, calc(100vw - 48px)); display: flex; flex-direction: column; gap: 4px;
      pointer-events: none;
    }
    .chat-log {
      display: none; max-height: 7.4em; overflow: hidden; padding: 4px 7px;
      background: rgba(12, 10, 9, 0.22); border-radius: 2px;
      font-size: 9pt; line-height: 1.35; color: #efeae4;
      text-shadow: 1px 1px 0 #1a1614, -1px 0 0 #1a1614;
    }
    .chat-log.has-msg { display: block; }
    .chat.open .chat-log {
      max-height: 240px; overflow-y: auto; pointer-events: auto;
      background: rgba(12, 10, 9, 0.32);
    }
    .chat-line { word-break: break-word; }
    .chat-nick { color: #d4a373; }
    .chat-input {
      display: none; pointer-events: auto;
      background: rgba(12, 10, 9, 0.35); border: 1px solid rgba(229, 225, 219, 0.18);
      color: #efeae4;
    }
    .chat.open .chat-input { display: block; }
    .edge-chip {
      position: absolute; z-index: 5; left: 0; top: 0; border: none; background: transparent;
      color: #c4bbb3; font-size: 8pt; padding: 2px 4px; cursor: pointer;
      white-space: nowrap; max-width: none; overflow: visible;
      display: flex; align-items: center; gap: 4px;
      font-family: Verdana, Arial, sans-serif;
      -webkit-text-stroke: 3px #1a1614; paint-order: stroke fill;
    }
    .edge-chip .bi { -webkit-text-stroke: 0; font-size: 11pt; line-height: 1; }
    #offscreen { position: absolute; inset: 0; pointer-events: none; }
    #offscreen .edge-chip { pointer-events: auto; }
    @media (max-width: 720px) {
      :root { --sidebar-w: min(240px, calc(100vw - 44px)); }
      .btn, .person { min-height: 36px; }
      .icon-btn { min-height: 36px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="board"></canvas>
    <div id="offscreen"></div>
    <div class="toast" id="toast"></div>
    <div class="chat" id="chat">
      <div class="chat-log" id="chat-log"></div>
      <input class="form-control chat-input" id="chat-input" maxlength="240" autocomplete="off" spellcheck="false" data-i18n-placeholder="chatPh">
    </div>
    <div class="statusbar" id="status-line"></div>
  </div>
  <button type="button" class="sidebar-toggle" id="sidebar-toggle" data-i18n-aria="panel" aria-expanded="true"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
  <aside class="sidebar" id="sidebar">
    <div>
      <div class="brand-row">
        <h1 class="brand">Soon</h1>
        <div class="lang">
          <button type="button" class="btn" id="lang-ru">RU</button>
          <button type="button" class="btn" id="lang-en">EN</button>
        </div>
      </div>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div>
      <div class="section-title" data-i18n="tools"></div>
      <div class="tool-group" id="tools">
        <button type="button" class="btn icon-btn active" data-tool="select" data-i18n-title="selectHint" data-i18n-aria="select"><i class="bi bi-cursor" aria-hidden="true"></i></button>
        <button type="button" class="btn icon-btn" data-tool="pan" data-i18n-title="panHint" data-i18n-aria="pan"><i class="bi bi-hand-index" aria-hidden="true"></i></button>
        <button type="button" class="btn icon-btn" data-tool="pen" data-i18n-title="penHint" data-i18n-aria="pen"><i class="bi bi-pencil" aria-hidden="true"></i></button>
        <button type="button" class="btn icon-btn" data-tool="eraser" data-i18n-title="eraserHint" data-i18n-aria="eraser"><i class="bi bi-eraser" aria-hidden="true"></i></button>
        <button type="button" class="btn icon-btn" data-tool="lasso" data-i18n-title="lassoHint" data-i18n-aria="lasso"><i class="bi bi-bounding-box" aria-hidden="true"></i></button>
        <button type="button" class="btn icon-btn" data-tool="image" data-i18n-title="imageHint" data-i18n-aria="image"><i class="bi bi-image" aria-hidden="true"></i></button>
      </div>
    </div>
    <div>
      <div class="section-title" data-i18n="color"></div>
      <div class="spectrum">
        <canvas id="sv-canvas" width="212" height="56"></canvas>
        <canvas id="hue-canvas" width="212" height="12"></canvas>
        <label class="meta" for="alpha"><span data-i18n="opacity"></span> <span id="alpha-label">100%</span></label>
        <input type="range" id="alpha" class="range-control" min="0" max="100" value="100">
        <input class="form-control" id="rgba" spellcheck="false" autocomplete="off">
      </div>
      <label class="meta" for="width" style="margin-top:6px"><span data-i18n="width"></span> <span id="width-label">3</span></label>
      <input type="range" id="width" class="range-control" min="1" max="32" value="3">
    </div>
    <div>
      <div class="section-title" id="people-title"></div>
      <div class="people" id="people"></div>
      <div class="nick-row" style="margin-top:6px">
        <input class="form-control" id="nick" maxlength="24" data-i18n-placeholder="nickPh" autocomplete="nickname">
        <button type="button" class="btn icon-btn" id="nick-save" data-i18n-title="saveNick" data-i18n-aria="saveNick"><i class="bi bi-check-lg" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="extras">
      <button type="button" class="btn icon-btn" id="share" data-i18n-title="copyLinkHint" data-i18n-aria="copyLink"><i class="bi bi-link-45deg" aria-hidden="true"></i></button>
      <button type="button" class="btn icon-btn" id="png" data-i18n-title="downloadPngHint" data-i18n-aria="downloadPng"><i class="bi bi-download" aria-hidden="true"></i></button>
      <button type="button" class="btn icon-btn active" id="grid-btn" data-i18n-title="toggleGridHint" data-i18n-aria="toggleGrid"><i class="bi bi-grid-3x3" aria-hidden="true"></i></button>
      <button type="button" class="btn icon-btn" id="fit" data-i18n-title="resetZoomHint" data-i18n-aria="resetZoom"><i class="bi bi-arrows-angle-contract" aria-hidden="true"></i></button>
    </div>
    <p class="help-text" data-i18n="help"></p>
  </aside>
</div>
<input type="file" id="file" hidden accept="image/png,image/jpeg,image/gif,image/webp">

<script>
(() => {
  const PREFIX = "/soon";
  const DOT = " · ";
  const I18N = {
    ru: {
      tagline: "общее пространство без аккаунтов",
      tools: "инструменты",
      select: "Выбор", selectHint: "Выбрать объект (V)",
      pan: "Перемещение", panHint: "Двигать холст (H, пробел)",
      pen: "Карандаш", penHint: "Рисовать (P)",
      eraser: "Ластик", eraserHint: "Стереть часть линии (E)",
      lasso: "Рамка", lassoHint: "Выделить прямоугольником, как в проводнике (L)",
      image: "Картинка", imageHint: "Вставить изображение (I, Ctrl+V)",
      color: "цвет", opacity: "прозрачность", width: "толщина",
      copyLink: "Копировать ссылку", copyLinkHint: "Ссылка на эту доску",
      downloadPng: "Скачать PNG", downloadPngHint: "Снимок видимой области",
      toggleGrid: "Сетка", toggleGridHint: "Показать или скрыть сетку",
      resetZoom: "Сбросить масштаб", resetZoomHint: "Вернуть вид 100% в начало холста",
      saveNick: "Сохранить", nickPh: "свой ник",
      chatPh: "сообщение…",
      help: "Клавиши по физическим кнопкам, на любой раскладке. T — чат, Delete — удалить выделенное. Картинку можно растянуть и повернуть за маркеры. Ctrl+C/V — копия и вставка, Ctrl+Z/Y — отмена. Два пальца двигают холст. Клик по человеку переносит к курсору.",
      online: "на связи", offline: "нет связи", reconnect: "переподключение…",
      you: "вы", guest: "гость", follow: "Перейти к",
      copied: "скопировано", copyFirst: "сначала выберите объект",
      imageOk: "картинка на доске", imagesOnly: "сюда можно только картинки",
      nickShort: "имя от 2 символов", cursorHidden: "курсор пока не виден",
      panel: "Панель", peopleN: (n) => {
        const n10 = n % 10, n100 = n % 100;
        const word = (n10 === 1 && n100 !== 11) ? "человек" : (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) ? "человека" : "человек";
        return "на доске " + n + " " + word;
      },
      empty: "рисуйте и кидайте картинки — все видят одно и то же",
      uploadFail: "не удалось загрузить",
    },
    en: {
      tagline: "shared space, no accounts",
      tools: "tools",
      select: "Select", selectHint: "Select an object (V)",
      pan: "Pan", panHint: "Move the canvas (H, Space)",
      pen: "Pencil", penHint: "Draw (P)",
      eraser: "Eraser", eraserHint: "Erase part of a stroke (E)",
      lasso: "Marquee", lassoHint: "Select with a rectangle, like in a file manager (L)",
      image: "Image", imageHint: "Insert an image (I, Ctrl+V)",
      color: "color", opacity: "opacity", width: "thickness",
      copyLink: "Copy link", copyLinkHint: "Link to this board",
      downloadPng: "Download PNG", downloadPngHint: "Snapshot of the visible area",
      toggleGrid: "Grid", toggleGridHint: "Show or hide the grid",
      resetZoom: "Reset zoom", resetZoomHint: "Return to 100% at the origin",
      saveNick: "Save", nickPh: "your nickname",
      chatPh: "message…",
      help: "Shortcuts follow physical keys on any layout. T opens chat, Delete removes the selection. Drag image handles to resize or rotate. Ctrl+C/V copy and paste, Ctrl+Z/Y undo. Two fingers pan. Click a person to jump to their cursor.",
      online: "online", offline: "offline", reconnect: "reconnecting…",
      you: "you", guest: "guest", follow: "Go to",
      copied: "copied", copyFirst: "select an object first",
      imageOk: "image placed", imagesOnly: "images only",
      nickShort: "name needs at least 2 characters", cursorHidden: "cursor not visible yet",
      panel: "Panel", peopleN: (n) => n === 1 ? "1 person on the board" : n + " people on the board",
      empty: "draw and drop images — everyone sees the same board",
      uploadFail: "upload failed",
    }
  };

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const toastEl = document.getElementById("toast");
  const fileInput = document.getElementById("file");
  const widthEl = document.getElementById("width");
  const alphaEl = document.getElementById("alpha");
  const rgbaEl = document.getElementById("rgba");
  const svCanvas = document.getElementById("sv-canvas");
  const hueCanvas = document.getElementById("hue-canvas");
  const svCtx = svCanvas.getContext("2d");
  const hueCtx = hueCanvas.getContext("2d");
  const appEl = document.getElementById("app");
  const nickEl = document.getElementById("nick");
  const chatEl = document.getElementById("chat");
  const chatLogEl = document.getElementById("chat-log");
  const chatInput = document.getElementById("chat-input");
  const mobile = window.matchMedia("(max-width: 720px)");

  const state = {
    lang: localStorage.getItem("soon-lang") === "en" ? "en" : "ru",
    me: null, tool: "select", color: "#d4a373", alpha: 1, hsv: { h: 28, s: 0.45, v: 0.83 },
    width: 3, grid: true, objects: new Map(), drafts: new Map(), users: new Map(),
    selected: new Set(), camera: { x: 0, y: 0, scale: 1 }, cssW: 1, cssH: 1,
    drawing: false, panning: false, moving: false, lassoing: false, erasing: false,
    start: null, last: null, hover: null, points: [], lasso: null, draftId: null, moveOrigins: new Map(),
    xform: null, eraseGesture: null, chat: [], chatOpen: false,
    undo: [], redo: [], clip: null, connected: false,
    ws: null, backoff: 600, imageCache: new Map(), dirty: true, space: false,
    pointers: new Map(), pinch: null, lastCursor: 0, followAnim: 0,
  };

  function t(key) {
    const value = I18N[state.lang][key];
    return typeof value === "function" ? value : value;
  }
  function toast(text) {
    toastEl.textContent = text;
    toastEl.style.display = "block";
    clearTimeout(toast.tid);
    toast.tid = setTimeout(() => { toastEl.style.display = "none"; }, 2800);
  }
  function uid() { return crypto.randomUUID().replace(/-/g, "").slice(0, 12); }
  function toScreen(x, y) {
    const { camera, cssW, cssH } = state;
    return { x: (x - camera.x) * camera.scale + cssW / 2, y: (y - camera.y) * camera.scale + cssH / 2 };
  }
  function toWorld(x, y) {
    const { camera, cssW, cssH } = state;
    return { x: (x - cssW / 2) / camera.scale + camera.x, y: (y - cssH / 2) / camera.scale + camera.y };
  }
  function pointer(ev) {
    const rect = canvas.getBoundingClientRect();
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  }
  function send(msg) {
    if (state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify(msg));
  }
  function maxZ() {
    let z = 0;
    for (const obj of state.objects.values()) z = Math.max(z, obj.z || 0);
    return z;
  }
  function typing() {
    const el = document.activeElement;
    return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
  }
  function physicalKey(ev) {
    const code = ev.code || "";
    if (code.startsWith("Key") && code.length === 4) return code.slice(3).toLowerCase();
    return "";
  }
  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function selectedObjects() {
    return [...state.selected].map((id) => state.objects.get(id) || state.drafts.get(id)).filter(Boolean);
  }
  function asOps(value) {
    return Array.isArray(value) ? value : value ? [value] : [];
  }
  function commit(op, inverse) {
    applyLocal(op);
    send({ type: "op", ...op });
    if (inverse) {
      state.undo.push({ do: [op], undo: [inverse] });
      if (state.undo.length > 80) state.undo.shift();
      state.redo = [];
    }
    state.dirty = true;
  }
  function commitBatch(doOps, undoOps) {
    if (!doOps.length) return;
    for (const op of doOps) {
      applyLocal(op);
      send({ type: "op", ...op });
    }
    state.undo.push({ do: doOps, undo: undoOps });
    if (state.undo.length > 80) state.undo.shift();
    state.redo = [];
    state.dirty = true;
  }
  function applyLocal(op) {
    if (op.op === "add" || op.op === "update") state.objects.set(op.object.id, clone(op.object));
    else if (op.op === "delete") {
      state.objects.delete(op.id);
      state.selected.delete(op.id);
      state.drafts.delete(op.id);
    } else if (op.op === "clear") {
      state.objects.clear();
      state.selected.clear();
    }
    state.dirty = true;
  }
  function doUndo() {
    const item = state.undo.pop();
    if (!item) return;
    const undos = asOps(item.undo);
    for (let i = undos.length - 1; i >= 0; i--) {
      applyLocal(undos[i]);
      send({ type: "op", ...undos[i] });
    }
    state.redo.push(item);
    state.dirty = true;
  }
  function doRedo() {
    const item = state.redo.pop();
    if (!item) return;
    for (const op of asOps(item.do)) {
      applyLocal(op);
      send({ type: "op", ...op });
    }
    state.undo.push(item);
    state.dirty = true;
  }

  function hsvToRgb(h, s, v) {
    const f = (n, k = (n + h / 60) % 6) => v - v * s * Math.max(Math.min(k, 4 - k, 1), 0);
    return [Math.round(f(5) * 255), Math.round(f(3) * 255), Math.round(f(1) * 255)];
  }
  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return { h, s: max ? d / max : 0, v: max };
  }
  function hexToRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];

  async function uploadBlob(blob, filename) {
    const body = new FormData();
    body.append("file", blob, filename || "paste.png");
    const res = await fetch(PREFIX + "/api/upload", { method: "POST", body });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: t("uploadFail") }));
      throw new Error(err.detail || res.statusText);
    }
    return res.json();
  }
  async function placeMedia(blob, filename, wx, wy) {

      const meta = await uploadBlob(blob, filename);

      const id = uid();
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 480 / Math.max(img.width, img.height));
        const obj = {
          id, type: "image", x: wx, y: wy,
          w: Math.max(40, img.width * scale), h: Math.max(40, img.height * scale),
          media_id: meta.id, alpha: state.alpha, rot: 0, z: maxZ() + 1,
        };
        commit({ op: "add", object: obj }, { op: "delete", id });
        state.selected = new Set([id]);
      };
      img.src = mediaUrl(meta.id);
      state.imageCache.set(meta.id, img);
      toast(t("imageOk"));
    } catch (err) { toast(String(err.message || err)); }
  }

    items.forEach((obj) => {
      const copy = clone(obj); copy.id = uid(); copy.z = maxZ() + 1;
      const next = translate(copy, dx, dy);

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(payload);
    toast(t("copied"));
    return payload;
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(proto + "//" + location.host + PREFIX + "/ws");
    state.ws = ws;
    ws.onopen = () => {
      state.backoff = 600; state.connected = true; updateStatus();
      const saved = sessionStorage.getItem("soon-name");
      if (saved) send({ type: "hello", name: saved });
    };
    ws.onclose = () => {
      state.connected = false;
      document.getElementById("status-line").textContent = t("reconnect");
      setTimeout(connect, state.backoff);
      state.backoff = Math.min(8000, state.backoff * 1.6);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch (_) { return; }
      if (msg.type === "hello") {
        state.me = { id: msg.id, name: msg.name, color: msg.color };
        state.objects = new Map((msg.objects || []).map((obj) => [obj.id, obj]));
        state.chat = Array.isArray(msg.chat) ? msg.chat.slice(-300) : [];
        nickEl.value = msg.name || "";
        state.connected = true; updateStatus(); renderChat(); state.dirty = true;
      } else if (msg.type === "nick") {
        if (state.me) state.me.name = msg.name;
        nickEl.value = msg.name;
        sessionStorage.setItem("soon-name", msg.name);
      } else if (msg.type === "op") {
        applyLocal(msg); state.dirty = true;
      } else if (msg.type === "draft") {
        if (msg.object) state.drafts.set(msg.object.id, msg.object);
        else state.drafts.delete(msg.id);
        if (msg.object && state.objects.has(msg.object.id) && !state.moveOrigins.has(msg.object.id)) {
          state.objects.set(msg.object.id, clone(msg.object));
        }
        state.dirty = true;
      } else if (msg.type === "presence") {
        const next = new Map();
        for (const u of msg.users || []) {
          const prev = state.users.get(u.id);
          next.set(u.id, {
            ...prev,
            ...u,
            x: Number.isFinite(u.x) ? u.x : prev && prev.x,
            y: Number.isFinite(u.y) ? u.y : prev && prev.y,
          });
        }
        state.users = next;
        renderPeople(); state.dirty = true;
      } else if (msg.type === "cursor") {
        const user = state.users.get(msg.id) || { id: msg.id };
        state.users.set(msg.id, { ...user, ...msg });
        state.dirty = true;
      } else if (msg.type === "chat") {
        state.chat.push({ id: msg.id, from: msg.from, name: msg.name, text: msg.text });
        if (state.chat.length > 300) state.chat.splice(0, state.chat.length - 300);
        renderChat();
      } else if (msg.type === "error") {
        toast(msg.message);
        if (msg.id) { state.objects.delete(msg.id); state.selected.delete(msg.id); state.dirty = true; }
      }
    };
  }

  function renderChat() {
    const msgs = state.chat.slice(-300);
    const visible = state.chatOpen ? msgs : msgs.slice(-8);
    chatLogEl.replaceChildren();
    chatLogEl.classList.toggle("has-msg", visible.length > 0);
    for (const m of visible) {
      const line = document.createElement("div");
      line.className = "chat-line";
      const nick = document.createElement("span");
      nick.className = "chat-nick";
      nick.textContent = (m.name || t("guest")) + ": ";
      const text = document.createElement("span");
      text.textContent = m.text || "";
      line.append(nick, text);
      chatLogEl.appendChild(line);
    }
    chatLogEl.scrollTop = chatLogEl.scrollHeight;
  }
  function openChat() {
    state.chatOpen = true;
    chatEl.classList.add("open");
    renderChat();
    chatInput.value = "";
    requestAnimationFrame(() => {
      chatInput.focus();
      chatInput.value = "";
    });
  }
  function closeChat() {
    state.chatOpen = false;
    chatEl.classList.remove("open");
    chatInput.blur();
    renderChat();
  }
  function sendChat() {
    const text = chatInput.value.trim();
    closeChat();
    if (!text) return;
    send({ type: "chat", text: text.slice(0, 240) });
  }

  function setSidebar(open) {
    appEl.classList.toggle("collapsed", !open);
    const toggle = document.getElementById("sidebar-toggle");
    toggle.innerHTML = open
      ? '<i class="bi bi-chevron-right" aria-hidden="true"></i>'
      : '<i class="bi bi-chevron-left" aria-hidden="true"></i>';
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    if (!mobile.matches) localStorage.setItem("soon-sidebar", open ? "1" : "0");
  }
  function sidebarOpen() { return !appEl.classList.contains("collapsed"); }

  function applyLang() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    document.getElementById("lang-ru").classList.toggle("active", state.lang === "ru");
    document.getElementById("lang-en").classList.toggle("active", state.lang === "en");
    renderPeople();
    state.dirty = true;
  }

  document.getElementById("lang-ru").addEventListener("click", () => { state.lang = "ru"; localStorage.setItem("soon-lang", "ru"); applyLang(); });
  document.getElementById("lang-en").addEventListener("click", () => { state.lang = "en"; localStorage.setItem("soon-lang", "en"); applyLang(); });
  document.getElementById("tools").addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-tool]");
    if (btn) setTool(btn.dataset.tool);
  });
  widthEl.addEventListener("input", () => {
    state.width = Number(widthEl.value);
    document.getElementById("width-label").textContent = widthEl.value;
  });
  alphaEl.addEventListener("input", () => {
    state.alpha = Number(alphaEl.value) / 100;
    document.getElementById("alpha-label").textContent = alphaEl.value + "%";
    rgbaEl.value = rgbaString();
  });
  rgbaEl.addEventListener("change", () => {
    const parsed = parseRgba(rgbaEl.value);
    if (!parsed) { rgbaEl.value = rgbaString(); return; }
    state.hsv = rgbToHsv(parsed.r, parsed.g, parsed.b);
    state.alpha = parsed.a;
    alphaEl.value = String(Math.round(parsed.a * 100));
    document.getElementById("alpha-label").textContent = alphaEl.value + "%";
    syncColorFromHsv();
  });
  const bindDrag = (el, handler) => {
    el.addEventListener("pointerdown", (ev) => { el.setPointerCapture(ev.pointerId); handler(ev); });
    el.addEventListener("pointermove", (ev) => { if (ev.buttons) handler(ev); });
  };
  bindDrag(svCanvas, pickSV);
  bindDrag(hueCanvas, pickHue);
  document.getElementById("share").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(location.origin + PREFIX + "/"); toast(t("copied")); }
    catch (_) { toast(location.origin + PREFIX + "/"); }
  });
  document.getElementById("png").addEventListener("click", () => {
    const a = document.createElement("a"); a.download = "soon.png"; a.href = canvas.toDataURL("image/png"); a.click();
  });
  document.getElementById("grid-btn").addEventListener("click", () => {
    state.grid = !state.grid;
    document.getElementById("grid-btn").classList.toggle("active", state.grid);
    state.dirty = true;
  });
  document.getElementById("fit").addEventListener("click", () => {
    stopFollow();
    state.camera = { x: 0, y: 0, scale: 1 }; state.dirty = true; updateStatus();
  });
  document.getElementById("nick-save").addEventListener("click", () => {
    const name = nickEl.value.trim();
    if (name.length < 2) { toast(t("nickShort")); return; }
    send({ type: "hello", name });
  });
  nickEl.addEventListener("keydown", (ev) => { if (ev.key === "Enter") document.getElementById("nick-save").click(); });
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!file) return;
    const mid = toWorld(state.cssW / 2, state.cssH / 2);
    await placeMedia(file, file.name, mid.x, mid.y);
  });
  document.getElementById("sidebar-toggle").addEventListener("click", () => setSidebar(!sidebarOpen()));

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  canvas.addEventListener("wheel", onWheel, { passive: false });
  canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());

  window.addEventListener("keydown", (ev) => {
    if (ev.code === "Escape" && state.chatOpen) { ev.preventDefault(); closeChat(); return; }
    if (ev.code === "Enter" && state.chatOpen && document.activeElement === chatInput) {
      ev.preventDefault(); sendChat(); return;
    }
    if (typing()) return;
    const letter = physicalKey(ev);
    if (ev.code === "Space") { state.space = true; ev.preventDefault(); }
    const mod = ev.ctrlKey || ev.metaKey;
    if (!mod && ev.code === "KeyT") { ev.preventDefault(); openChat(); return; }
    if (mod && ev.code === "KeyZ" && !ev.shiftKey) { ev.preventDefault(); doUndo(); return; }
    if ((mod && ev.code === "KeyY") || (mod && ev.code === "KeyZ" && ev.shiftKey)) { ev.preventDefault(); doRedo(); return; }
    if (mod && (ev.code === "KeyC" || ev.code === "KeyV")) return;
    if (ev.key === "Delete" || ev.key === "Backspace") {
      const items = selectedObjects();
      if (items.length) {
        ev.preventDefault();
        commitBatch(
          items.map((obj) => ({ op: "delete", id: obj.id })),
          items.map((obj) => ({ op: "add", object: clone(obj) }))
        );
      }
    }
    const tools = { v: "select", h: "pan", p: "pen", e: "eraser", l: "lasso", i: "image" };
    if (!mod && tools[letter]) setTool(tools[letter]);
  });
  window.addEventListener("keyup", (ev) => { if (ev.code === "Space") state.space = false; });
  window.addEventListener("copy", (ev) => {
    if (typing()) return;
    const payload = copySelected();
    if (payload && ev.clipboardData) { ev.preventDefault(); ev.clipboardData.setData("text/plain", payload); }
  });
  window.addEventListener("paste", async (ev) => {
    if (typing()) return;
    const mid = toWorld(state.cssW / 2, state.cssH / 2);
    const items = ev.clipboardData && ev.clipboardData.items;
    if (items) {
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          ev.preventDefault();
          const blob = item.getAsFile();
          if (blob) await placeMedia(blob, "paste.png", mid.x, mid.y);
          return;
        }
      }
    }
    const text = ev.clipboardData && ev.clipboardData.getData("text/plain");
    if (text) {
      try {
        const parsed = JSON.parse(text);
        const list = parsed && parsed.soon && (parsed.objects || (parsed.object ? [parsed.object] : null));
        if (list && list.length) { ev.preventDefault(); pasteObjects(list, mid.x + 16, mid.y + 16); return; }
      } catch (_) {}
    }
    if (state.clip) pasteObjects(state.clip, mid.x + 16, mid.y + 16);
  });
  document.getElementById("stage").addEventListener("dragover", (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = "copy"; });
  document.getElementById("stage").addEventListener("drop", async (ev) => {
    ev.preventDefault();
    const w = toWorld(pointer(ev).x, pointer(ev).y);
    const files = [...(ev.dataTransfer.files || [])];
    const image = files.find((f) => f.type.startsWith("image/"));
    if (image) await placeMedia(image, image.name, w.x, w.y);
    else if (files.length) toast(t("imagesOnly"));
  });

  setInterval(() => send({ type: "ping" }), 25000);
  window.addEventListener("resize", resize);
  mobile.addEventListener("change", () => setSidebar(!mobile.matches && localStorage.getItem("soon-sidebar") !== "0"));

  const rgb = hexToRgb(state.color);
  state.hsv = rgbToHsv(rgb[0], rgb[1], rgb[2]);
  syncColorFromHsv();
  applyLang();
  setSidebar(!mobile.matches && localStorage.getItem("soon-sidebar") !== "0");
  resize();
  connect();
  loop();
})();
</script>
</body>
</html>
